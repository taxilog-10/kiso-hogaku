学6編・完全総整理","基礎法学の完成形"]],"chapters":{"1":{"1":"法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する","2":"もし社会に共通のルールがなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n争い\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の紛争を予防・解決する機能\nがある。","3":"法には複数の目的がある。\n主なものは、\n1. 社会秩序の維持\n2. 権利・利益の保護\n3. 紛争の解決\n4. 公正・公平の実現\n5. 人権の保障\n6. 国家権力の統制\nである。\nしたがって、\n法＝単に人を縛るルール\nではない。\nむしろ、\n人々の自由や権利を保障するためにも法が存在する。","4":"法は社会から切り離して存在するものではない。\n社会\n↓\n人々の生活・利害\n↓\n問題・紛争\n↓\n法によるルール形成\n↓\n社会秩序\n社会が変化すれば、\n必要とされる法も変化する。\n例えば、\n• インターネット\n• AI\n• 個人情報\n• 電子商取引\n• 環境問題\nなど、新しい社会問題が生じれば、それに対応する法制度も発展する。","5":"法規範とは、\n人々の行為を一定の基準によって規律する法的なルール\nである。\n例えば、\n他人の物を勝手に奪ってはいけない。\nというルールがある。\n法規範は一般に、\n一定の要件\n↓\n一定の効果\nという構造を持つ。","6":"法律を理解するうえで、\n要件と効果\nは非常に重要。\n要件\nその法律上の効果が発生するために必要な条件。\n効果\n要件が満たされた場合に発生する法律上の結果。\n例えば、\n契約が成立\n↓\n一定の要件を満たす\n↓\n契約上の権利・義務が発生\nという構造。\n法律を読むときは、\n「どんな場合に、何が起こるのか」\nを見る。","7":"権利とは、\n法によって保護され、一定の利益を享受したり、他者に一定の行為を求めたりできる法的な地位\nと理解するとよい。\n例えば、\n売買契約が成立\n↓\n買主\n↓\n目的物を引き渡せと請求できる\nという場合、\n買主には引渡請求権がある。","8":"権利には、\n「自分が何かをできる」\nだけではなく、\n「他人に何かを求められる」\nという側面もある。\n例えば、\nA\n↓\nBに100万円を貸す\n↓\n返済期限到来\n↓\nA\n↓\nBに返還を請求できる\nこのときAには、\n貸金返還請求権\nがある。","9":"義務とは、\n法によって一定の行為をすること、またはしないことを要求される法的な拘束\nである。\n例えば、\nAがBから100万円を借りる\n↓\nA\n↓\n返還義務\n↓\nB\n↓\n返還請求権\nという関係になる。","10":"権利と義務は、\n相互に対応することが多い。\n例えば、\nA\n貸金返還請求権\n↓\nB\n返還義務\nという関係。\nしたがって、\n「誰が権利者で、誰が義務者なのか」\nを確認することが法律関係を理解する基本になる。","11":"法律関係とは、\n法によって規律された人と人との関係\nである。\n例えば、\n売買契約なら、\n売主\n↓\n目的物引渡義務\n買主\n↓\n代金支払義務\nという法律関係が発生する。","12":"法律関係を考えるときは、\n① 誰が\n↓\n② 誰に対して\n↓\n③ 何を請求・要求できるか\n↓\n④ 何をする義務があるか\n↓\n⑤ その根拠となる法は何か\nを見る。\nこれが法律学の基本的な視点になる。","13":"法と道徳は似ている部分がある。\n例えば、\n「人を傷つけてはいけない」\nという考えは、\n道徳にも法にも関係する。\nしかし、\n法＝道徳\nではない。\n法と道徳には違いがある。","14":"法\n国家による公的な強制と結びつく。\n道徳\n社会的・個人的な価値判断や良心に基づく。\n例えば、\n「困っている人を助けるべきだ」\nというのは道徳上重要でも、\nすべての場合に国家が法的義務として強制するとは限らない。\nしたがって、\n道徳\n＝\n「人としてどうあるべきか」\n\n法\n＝\n「社会において何をすべきか・してはいけないかを公的に規律する」\nと考える。","15":"完全に別ではない。\n実際には、\n道徳的価値が法律に取り込まれる\nことがある。\n例えば、\n• 殺人禁止\n• 窃盗禁止\n• 他人への損害賠償\n• 信義則\nなど。\nしたがって、\n法と道徳は区別されるが、相互に影響する。","16":"社会では、\n長期間繰り返されている慣行\nが存在する。\nこれを、\n慣習\nという。\nただし、\nすべての慣習が法になるわけではない。\n一定の要件の下で法的効力が認められるものがある。","17":"「習慣」と「法的な慣習」は区別する。\n習慣\n単に人々が繰り返している行動。\n慣習法\n一定の社会的慣行が、\n法として認められるもの。\nしたがって、\n繰り返されている\n≠\n必ず法になる","18":"社会には法以外にも規範がある。\n例えば、\n• 道徳\n• 宗教\n• 慣習\n• 社会的ルール\n• 礼儀\nなど。\nこれらをまとめて、\n社会規範\nと考えることができる。\n社会規範\n│\n├─ 法\n├─ 道徳\n├─ 宗教\n├─ 慣習\n└─ 礼儀・社会的ルール","19":"法　道徳　礼儀・慣習\n公的強制　強い　原則なし　原則なし\n国家による制度化　あり　原則なし　原則なし\n違反への制裁　法的制裁　道徳的非難等　社会的非難等\n目的　社会秩序・権利保障等　善悪・人格　社会生活の円滑化\nただし、\n現実には完全に切り分けられるわけではない。","20":"法の重要な特徴の一つは、\n公的な強制力と結びついていること\nである。\n例えば、\n契約上の義務を履行しない\n↓\n裁判\n↓\n判決\n↓\n必要に応じて強制執行\nということが可能になる。","21":"ただし、\n法＝常に国家が力で従わせる\nという意味ではない。\n多くの人は、\n法律だから守る\nという形で自発的に法に従っている。\nしたがって、\n法\n↓\nルールを設定\n↓\n通常は自発的に遵守\n↓\n違反\n↓\n必要に応じて公的強制\nという構造になる。","22":"法に違反した場合、\n法的な不利益\nが発生することがある。\n例えば、\n刑事法\n犯罪\n↓\n刑罰\n民法\n契約違反\n↓\n損害賠償・履行請求・解除など\n行政法\n法令違反\n↓\n行政処分・行政上の義務履行確保など\nというように分野によって異なる。","23":"現代国家では、\n法は国家権力とも密接に関係する。\n特に重要なのが、\n国家権力自身も法に従わなければならない\nという考え方。\nこれが、\n法の支配\nにつながる。","24":"法の支配とは、\n国家権力を法によって拘束し、人権や自由を保障するという原理\nである。\n国家権力\n↓\n法によって拘束\n↓\n恣意的な権力行使を防止\n↓\n国民の権利・自由を保障\nこれは憲法と深く関係する。","25":"法治主義とは、\n行政などの国家作用を法に基づいて行わせるという考え方\nである。\n特に行政法では、\n法律による行政\nという考え方が重要になる。","26":"両者は似ているが、完全に同じではない。\n法治主義\n国家作用が法に従って行われることを重視する。\n法の支配\n法そのものが人権保障・権力統制を実現するものであることを重視する。\nしたがって、\n法治主義\n→ 「法に従って行政等を行う」\n\n法の支配\n→ 「国家権力そのものを法で拘束する」\nというイメージを持つ。","27":"法には、\n正義・公平\nを実現する役割もある。\n例えば、\n同じ条件の人を合理的理由なく差別する\n↓\n不公平\nとなる。\nそこで法は、\n公平な扱い\nを実現しようとする。\nただし、\n「公平とは何か」\nについては社会によって議論が生じる。","28":"形式的正義\n同じルールを同じように適用する。\n実質的正義\n個々の事情を考慮して、実質的に公平な結果を目指す。\n例えば、\n全員に同じルール\n↓\n形式的公平\n\n弱者への特別な保護\n↓\n実質的公平\nという違いがある。","29":"法は自由を制限することがある。\n例えば、\n他人を傷つけてはいけない。\nというルール。\n一見すると、\n自由を制限している。\nしかし、\nもし他人を自由に傷つけられる社会なら、\n他人の自由も保障されない。\nしたがって法は、\n自由を制限することで、他者の自由を保障する\nという側面も持つ。","30":"法は、\n権利を認めるだけではなく、その権利を実現する仕組み\nも用意する。\n例えば、\n権利侵害\n↓\n裁判\n↓\n判決\n↓\n強制執行\nという仕組み。\nしたがって、\n権利＋救済制度\nが重要になる。","31":"権利には、\n対応する義務\nが存在することが多い。\n例えば、\nAの所有権\n↓\n他人が勝手に使用・侵害しない義務\nという関係。\nしたがって、\n権利保障は、他者に一定の義務を課すことによって実現される。","32":"法を大きく分類すると、\n公法と私法\nという区分がある。\n公法\n国家・公共団体と私人、または国家機関相互の関係などを中心に規律する法。\n例：\n• 憲法\n• 行政法\n• 刑法\n私法\n私人相互の関係を中心に規律する法。\n例：\n• 民法\n• 商法\n• 会社法\nただし、\nこの分類は絶対的ではない。","33":"もう一つ重要な分類が、\n実体法と手続法\nである。\n実体法\n権利・義務などの法律関係そのものを定める。\n例：\n民法、刑法など。\n手続法\n権利の実現や紛争解決の手続を定める。\n例：\n民事訴訟法、刑事訴訟法など。","34":"法律には、\n一般法\nと、\n特別法\nという関係もある。\n例えば、\n一般的ルール\n↓\n民法\n\n特定の場面について特別ルール\n↓\n商法・会社法等\nという関係。","35":"一般に、\n特別法は一般法に優先する\nという原則がある。\n例えば、\n一般的なルール\n↓\n特別な場面\n↓\n特別法が存在\n↓\n特別法を優先\nという考え方。\nただし、\n実際の適用では具体的な条文関係を確認する必要がある。","36":"強行法規\n当事者が、\n「この法律は適用しない」\nと合意しても排除できない規定。\n任意法規\n当事者が別の内容を合意すれば、\nその合意を優先できる規定。","37":"例えば、\n契約について法律が、\n「特別な合意がない場合はAとする」\nと定めているなら、\n当事者が、\n「Bとする」\nと合意できる場合がある。\nこれが任意規定。\n一方、\n公益や弱者保護などの観点から、当事者の合意によって変更できない\n場合には強行規定が問題になる。","38":"法の分類は、\n単なる暗記のためではない。\n分類することで、\n「この法律はどのような目的・構造を持っているのか」\nを理解できる。\n公法・私法\n↓\n誰と誰の関係か\n\n実体法・手続法\n↓\n何を定める法か\n\n一般法・特別法\n↓\nどちらを優先するか\n\n強行法規・任意法規\n↓\n当事者が変更できるか","39":"法的主体とは、\n法によって権利や義務の主体となることができる者\nである。\n代表的なのは、\n• 自然人\n• 法人\nである。","40":"自然人とは、\n生身の人間\nのこと。\n民法では、\n人は権利能力を持つ\nというところから法律関係が始まる。","41":"法人とは、\n法律によって法人格を認められた組織等\nである。\n例えば、\n• 株式会社\n• 一般社団法人\n• 一般財団法人\nなど。\n法人は、\n自然人ではないが、法によって権利義務の主体となる。","42":"法人格とは、\n独立した権利・義務の主体として法律上扱われる資格\nである。\n例えば株式会社では、\n株主\n↓\n出資\n↓\n株式会社\n↓\n会社自身が権利・義務を持つ\nという構造になる。","43":"法律関係では、\n主体\nと、\n客体\nを区別する。\n主体\n権利・義務の主体。\n客体\n権利の対象となるもの。\n例えば、\nAがBの土地を所有している。\nA\n↓\n権利主体\n\n所有権\n↓\n権利\n\n土地\n↓\n権利の客体\nとなる。","44":"法律行為とは、\n当事者の意思表示によって法律上の効果を発生させる行為\nである。\n代表例は、\n契約\nである。\n売りたい\n＋\n買いたい\n↓\n意思の合致\n↓\n売買契約\n↓\n法律上の権利・義務","45":"意思表示とは、\n一定の法律効果を発生させようとする意思を外部に表示すること\nである。\n例えば、\n「この土地を1,000万円で売ります」\nという意思表示。\n相手が、\n「買います」\nと応じれば、\n契約成立へ進む。","46":"契約とは、\n当事者間の意思の合致によって成立する法律行為\nである。\n例えば売買契約なら、\n売主\n「売る」\n\n買主\n「買う」\n\n↓\n意思の合致\n↓\n売買契約\nとなる。","47":"契約では、\n誰と契約するか\n\nどのような契約をするか\n\n契約するかどうか\nについて原則として自由が認められる。\nこれを、\n契約自由の原則\nという。\nただし、\n公序良俗・強行法規・消費者保護などによる制約\nがある。","48":"法に違反した場合、\n法的責任\nが発生することがある。\n代表的には、\n民事責任\n損害賠償など。\n刑事責任\n刑罰など。\n行政上の責任・不利益\n行政処分など。\n法違反\n↓\nどの分野の問題か\n↓\n民事？\n刑事？\n行政？\n↓\n対応する責任を判断","49":"責任と制裁は関連するが、\n完全に同じ概念ではない。\n例えば民事責任では、\n被害者の損害を回復する\nことが中心となる。\n刑事責任では、\n犯罪に対する刑罰\nが中心となる。\n行政法では、\n行政目的を実現するための処分\nなどが問題となる。","50":"法律は、\n具体的な事実に適用\nされる。\n基本構造は、\n法律\n↓\n要件を確認\n↓\n具体的事実を確認\n↓\n要件に当てはめる\n↓\n法律効果を導く\nこれを、\n法の適用\nという。","51":"法律学では、\n一般的な法規範\nと、\n具体的な事実\nを結びつけて結論を出す。\n基本的には、\n大前提\n↓\n法律のルール\n\n小前提\n↓\n具体的事実\n\n結論\n↓\n法律効果\nという構造。\nこれが、\n法的三段論法\nの基本である。","52":"法律問題では、\n① 事実を確認\n↓\n② 問題となる法律関係を特定\n↓\n③ 適用される法律を探す\n↓\n④ 要件を確認\n↓\n⑤ 事実を要件に当てはめる\n↓\n⑥ 法律効果を判断\n↓\n⑦ 必要なら救済手段を確認\nという流れで考える。","53":"法律の条文を読むだけでは、\n答えが一つに決まらない\n場合がある。\nそこで、\n法解釈\nが必要になる。\n法解釈とは、\n条文の意味・内容を明らかにする作業\nである。","54":"条文を読むときは、\n「誰に対して、どんな場合に、何を認め、何を禁止し、どのような効果を発生させているのか」\nを見る。\n特に、\n• 主体\n• 要件\n• 効果\n• 例外\n• ただし書\n• 準用\nなどを確認する。","55":"法は、\n条文を書くだけでは意味がない。\n法が実際に機能するには、\n法律\n↓\n行政\n↓\n裁判\n↓\n強制執行\n↓\n権利・義務の実現\nという仕組みが必要になる。","56":"法に関する争いが発生した場合、\n裁判所\nが法を解釈・適用して判断する。\n例えば、\nAとBが争う\n↓\n裁判所\n↓\n事実認定\n↓\n法解釈\n↓\n法適用\n↓\n判決\nとなる。","57":"行政も法に基づいて活動する。\n例えば、\n許可\n認可\n行政処分\nなど。\nしたがって、\n行政法では「行政がどのような根拠で、どこまで行動できるのか」\nが重要になる。","58":"刑法では、\nどのような行為が犯罪になるのか\nを法律によって定める。\nそして、\n犯罪が成立した場合にどのような刑罰が科されるのか\nを定める。\nここでは、\n罪刑法定主義\nが重要になる。","59":"法は、\n人権を保障するためにも存在する。\n特に憲法では、\n• 個人の尊重\n• 基本的人権\n• 法の下の平等\n• 表現の自由\n• 財産権\n• 適正手続\nなどが保障されている。\nつまり、\n法は国家権力から国民を守る役割も持つ。","60":"法によって、\n社会のすべての問題を完全に解決できるわけではない。\n例えば、\n• 道徳\n• 人間関係\n• 個人の価値観\n• 政治的判断\n• 経済的問題\nなどは法だけでは処理できない。\nしたがって、\n法にはできることと、できないことがある。","61":"法と政治は密接に関係する。\n例えば、\n政治\n↓\n社会の課題を発見\n↓\n政策を決定\n↓\n法律を制定\n↓\n行政が実施\n↓\n社会に影響\nという流れがある。\nただし、\n政治が決めれば何でも法律にできる\nわけではない。\n憲法による制約が存在する。","62":"経済活動も法によって規律される。\n例えば、\n• 契約\n• 所有権\n• 会社\n• 株式\n• 金融\n• 消費者保護\n• 独占禁止\nなど。\nしたがって、\n法は経済活動のルールを作る役割も持つ。","63":"倫理とは、\n「何が正しいのか」\n\n「人間はどう行動すべきか」\nという問題に関係する。\n法も倫理的価値から影響を受けるが、\n法律で規定されていないことがすべて倫理的に正しいわけではない。\n逆に、\n倫理的に問題があることがすべて違法とも限らない。","64":"ここまでをまとめる。\n人間\n↓\n社会生活\n↓\n利害・紛争\n↓\n社会規範\n↓\n法\n↓\n権利・義務\n↓\n法律関係\n↓\n法的責任\n↓\n裁判・行政等による実現","65":"法律を学ぶときは、次の5つを見る。\n① 主体\n誰が関係しているのか。\n② 客体\n何が問題になっているのか。\n③ 権利・義務\n誰が何を請求でき、誰が何をしなければならないのか。\n④ 要件・効果\nどの条件で、どの法律効果が発生するのか。\n⑤ 救済\n権利が侵害された場合、どうやって実現・回復するのか。\n主体\n↓\n客体\n↓\n権利・義務\n↓\n要件・効果\n↓\n救済","66":"「法とは何か」を一言で表すなら、\n法とは、社会における人々の行動・権利・義務・責任を公的に規律し、社会秩序と権利保障を実現するための規範である。\nそして法律を理解するときは、\n誰が？\n↓\n誰との間で？\n↓\n何について？\n↓\nどんな権利・義務がある？\n↓\nどんな要件で？\n↓\nどんな効果が発生する？\n↓\n違反したらどうなる？\n↓\nどう救済する？\nと考える。","67":"以下を何も見ずに説明してみる。\n1. 法とは何か。\n2. なぜ法が必要なのか。\n3. 法の目的は何か。\n4. 法規範とは何か。\n5. 要件と効果とは何か。\n6. 権利とは何か。\n7. 義務とは何か。\n8. 権利と義務はどう関係するか。\n9. 法律関係とは何か。\n10. 法と道徳の違いは何か。\n11. 法と慣習の違いは何か。\n12. 法と社会規範の関係は？\n13. 法の強制力とは何か。\n14. 法の支配とは何か。\n15. 法治主義とは何か。\n16. 法の支配と法治主義の違いは？\n17. 公法と私法の違いは？\n18. 実体法と手続法の違いは？\n19. 一般法と特別法の違いは？\n20. 強行法規と任意法規の違いは？\n21. 法的主体とは何か。\n22. 自然人と法人の違いは？\n23. 法人格とは何か。\n24. 法律行為とは何か。\n25. 意思表示とは何か。\n26. 契約とは何か。\n27. 契約自由の原則とは何か。\n28. 民事責任と刑事責任の違いは？\n29. 法の適用とは何か。\n30. 法的三段論法とは何か。\n31. 法解釈とは何か。\n32. 法と裁判はどう関係するか。\n33. 法と行政はどう関係するか。\n34. 法と人権はどう関係するか。\n35. 法にはどのような限界があるか。","68":"① 法とは\n社会を規律する公的な規範\n↓\n② 法が必要な理由\n社会生活\n↓\n利害対立\n↓\n紛争\n↓\n共通ルールが必要\n↓\n法\n↓\n③ 法が守るもの\n社会秩序\n＋\n権利\n＋\n自由\n＋\n公平\n＋\n人権\n↓\n④ 法律関係\n主体\n↓\n権利・義務\n↓\n客体\n↓\n⑤ 法規範\n要件\n↓\n法律効果\n↓\n⑥ 法の実現\n法律\n↓\n行政・裁判\n↓\n必要に応じた強制\n↓\n権利・義務の実現\n↓\n⑦ 法的思考\n事実\n↓\n問題発見\n↓\n法規範\n↓\n要件\n↓\n当てはめ\n↓\n法律効果\n↓\n救済\n\n★ 第1編の最重要ポイント10\n1. 法は社会を規律する公的な規範である。\n2. 法には社会秩序を維持する機能がある。\n3. 法には権利・自由・人権を保障する機能もある。\n4. 権利には、それに対応する義務が存在することが多い。\n5. 法律関係では「誰が・誰に・何を請求できるか」を考える。\n6. 法規範は「要件→効果」という構造で理解すると分かりやすい。\n7. 法と道徳・慣習・社会規範は区別する。\n8. 法の支配は国家権力そのものを法によって拘束する考え方である。\n9. 法的主体には自然人や法人がある。\n10. 法律問題は「事実→法規範→要件→当てはめ→効果→救済」で考える。\n\n第1編 完成\n基礎法学では、ここから、\n第1編　法とは何か\n↓\n第2編　法の種類・法体系\n↓\n第3編　法源・法の適用・解釈\n↓\n第4編　裁判・司法制度・法的手続\n↓\n第5編　法的思考・法律学\n↓\n第6編　現代社会と法・基礎法学総整理\nという順番で進める。\n第1編で最も重要なのは、\n「法律を暗記する前に、法が何をしているのかを理解する」\nことである。\nこれが分かると、憲法・民法・行政法・刑法・商法・会社法を学んだときも、それぞれの法律が「誰の、どのような法律関係を、どのようなルールで規律しているのか」という共通の視点から見られるようになる。"},"2":{"1":"第1章　法源とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、どこから来たのか？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","2":"第2章　なぜ法源を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n法的な根拠\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","3":"第3章　成文法\n成文法とは、\n文章として明確な形式で制定された法\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","4":"第4章　不文法\n不文法とは、\n成文法のように一つの制定文書として存在しない法\nをいう。\n代表的なものとして、\n• 慣習法\n• 一定の法原理\n• 判例上形成された法理\nなどが問題となる。\nただし、\n日本では成文法が法体系の中心的な位置を占めている。\n","5":"第5章　成文法と不文法\n成文法　不文法\n形式　文章化されている　一つの制定文書ではない\n代表例　憲法・法律・命令　慣習法等\n明確性　比較的高い　内容の確定に解釈等が必要\n公示　制度化されている　形式によって異なる\n","6":"第6章　憲法\n日本の法体系において、\n憲法は最高法規\nである。\n憲法に反する法律等は、\nその効力が問題となる。\n憲法\n↓\n法律\n↓\n命令\n↓\n行政\nという基本構造を理解する。\n","7":"第7章　法律\n法律とは、\n国会が制定する法規範\nである。\n国民の権利・義務に関わる重要な事項について、\n国会による立法\nが行われる。\n","8":"第8章　命令\n命令とは、\n行政機関が制定する法規範\nである。\n代表的には、\n• 政令\n• 府令\n• 省令\nなど。\nただし、\n命令は法律に反することができない。\n","9":"第9章　政令\n政令は、\n内閣が制定する命令\nである。\n法律を執行するため、\n法律から委任された事項等\nについて定める。\nしたがって、\n法律\n↓\n政令\n↓\n具体化\nという関係がある。\n","10":"第10章　省令\n省令は、\n各省の大臣が発する命令\nである。\n法律や政令に基づいて、\nより具体的な事項\nを定める。\n","11":"第11章　条例\n条例は、\n地方公共団体が制定する自治立法\nである。\n地方の実情に応じて、\n地域社会を規律するルール\nを定める。\nただし、\n法律の範囲内\nでなければならない。\n","12":"第12章　憲法・法律・命令・条例\n基本的には、\n憲法\n↓\n法律\n↓\n政令・省令等\nという関係を押さえる。\n地方公共団体については、\n憲法\n↓\n法律\n↓\n条例\nという関係も重要になる。\nただし、\n「すべての法令が単純な一列の上下関係にある」\nと考えるのは正確ではない。\n","13":"第13章　法令の優劣\n法規範が複数存在する場合、\nどの規範が優先するのか\nが問題になる。\n基本的には、\n上位の法規範に反する下位の法規範は許されない。\n例えば、\n憲法\n↓\n法律\n↓\n命令\nという関係。\n","14":"第14章　法令の抵触\n例えば、\n法律A\n↓\n「Xを認める」\n命令B\n↓\n「Xを禁止する」\nとする。\n命令Bが法律Aに反するなら、\n命令Bの適法性・効力が問題になる。\nしたがって、\n法令間の矛盾を発見したら、法形式と根拠規定を確認する。\n","15":"第15章　法律の留保\n行政が国民の権利・自由を制約する場合、\n法律上の根拠\nが必要となる場面がある。\nこれに関係するのが、\n法律の留保\nという考え方。\n行政法では、\n「行政はどこまで法律なしに活動できるのか」\nという問題につながる。\n","16":"第16章　委任立法\n国会が法律を制定し、\n詳細な事項を命令に委ねる\nことがある。\nこれを、\n委任立法\nという。\n国会\n↓\n法律\n↓\n「詳細は政令で定める」\n↓\n内閣\n↓\n政令\nという構造。\n","17":"第17章　委任の限界\n国会が行政に、\n何でも自由に決めてよい\nと委任できるわけではない。\n委任には、\n法律による統制\nが必要。\n特に、\n国民の権利・義務に重大な影響を与える事項\nについては、委任の内容・範囲が問題になる。\n","18":"第18章　慣習法\n慣習法とは、\n社会において一定の慣行が繰り返され、法として認められるもの\nである。\nただし、\n単なる慣習＝慣習法\nではない。\n慣行\n↓\n長期間・反復\n↓\n法的規範として認められる\n↓\n慣習法\nというイメージ。\n","19":"第19章　慣習と法律\n法律と慣習が存在する場合、\nどちらを適用するか\nが問題になる。\n日本法では、\n法令による規律が基本\nであり、慣習が法的効力を持つかどうかは、\n民法など個別の規定も確認する必要がある。\n","20":"第20章　判例とは何か\n判例とは、\n裁判所が具体的事件について示した判断\nである。\n特に、\n最高裁判所の判断\nは、その後の同種事件の法解釈に大きな影響を与える。\n","21":"第21章　判例は法律そのものなのか\nここは重要。\n日本では、\n裁判所の判決が国会制定法と全く同じ意味で「法律」になるわけではない。\nしかし、\n先例として非常に重要な法的意味\nを持つ。\nしたがって、\n法律\n↓\n条文\n↓\n裁判所による解釈\n↓\n判例\n↓\nその後の事件に影響\nという関係を理解する。\n","22":"第22章　最高裁判例の重要性\n最高裁判所がある法律について、\n一定の解釈\nを示した場合、\n下級裁判所もその判断を強く意識して判断する。\nまた、\n実務上、最高裁判例は非常に重要な法解釈の基準\nとなる。\n","23":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n裁判所が解釈\n↓\n判例\n↓\n条文の具体的意味が明らかになる\nという関係が多い。\n","24":"第24章　判例と法解釈\n法律には、\n抽象的な文言\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n具体的事件でどのような意味を持つか\nを判断する。\n","25":"第25章　法解釈とは何か\n法解釈とは、\n法規範の意味・内容を明らかにする作業\nである。\n単に、\n条文を読む\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","26":"第26章　なぜ法解釈が必要なのか\n法律の条文は、\nすべての具体的事件を詳細に書いているわけではない。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","27":"第27章　文理解釈\n文理解釈とは、\n条文の文言・文章構造を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","28":"第28章　論理解釈\n論理解釈とは、\n条文の文言だけでなく、制度・目的・他の条文との関係などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","29":"第29章　目的論的解釈\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n消費者保護という目的\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","30":"第30章　体系解釈\n体系解釈とは、\nその条文だけでなく、法律全体・法体系との関係から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","31":"第31章　反対解釈\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を適用しないと考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","32":"第32章　類推解釈\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n法律が規定\nBの場合\n↓\n条文には直接書いていない\n↓\nAとBの趣旨が実質的に同じ\n↓\n類推適用を検討\n","33":"第33章　拡張解釈\n拡張解釈とは、\n条文の文言が通常理解される範囲よりも広く、その意味を解する解釈\nである。\nただし、\n法律の文言から完全に離れて自由に意味を作ることではない。\n","34":"第34章　縮小解釈\n縮小解釈とは、\n条文の文言上は広く読める場合でも、趣旨等から適用範囲を狭くする解釈\nである。\n例えば、\n文言だけなら広く適用できそうだが、制度趣旨から一部の場合を除外する\nといった場合。\n","35":"第35章　反対解釈と類推解釈\nこの2つは混同しやすい。\n反対解釈\nA\n↓\n法律が適用される\nB\n↓\nAと反対だから\n↓\n法律を適用しない\n類推解釈\nA\n↓\n法律が適用される\nB\n↓\nAと趣旨が同じ\n↓\n条文を類推適用\nつまり、\n反対解釈＝適用しない方向\n類推解釈＝適用する方向\nというイメージ。\n","36":"第36章　類推解釈と刑法\n刑法では、\n類推解釈によって犯罪成立範囲を広げること\nは許されない。\nこれは、\n罪刑法定主義\nと関係する。\n刑罰\n↓\n法律による明確な根拠\n↓\n犯罪成立範囲を勝手に拡張\n×\n","37":"第37章　法解釈と人権保障\n憲法上の人権に関わる場合、\n国家権力による人権制約\nが問題になる。\nそのため、\n法律の文言・目的・憲法との整合性\nなどを慎重に検討する必要がある。\n","38":"第38章　法解釈と憲法\n法律の解釈は、\n憲法に適合するように行う\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n憲法適合的な解釈が可能か\nを検討することがある。\n","39":"第39章　法の適用とは何か\n法の適用とは、\n一般的な法規範を具体的な事件・事実に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n法律効果\n","40":"第40章　法適用の基本構造\n法の適用は、\n① 法規範を発見\n↓\n② 法規範を解釈\n↓\n③ 事実を確定\n↓\n④ 要件に当てはめる\n↓\n⑤ 法律効果を導く\nという流れになる。\n","41":"第41章　事実認定\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に意思の合致があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","42":"第42章　法的評価\n事実を確認しただけでは、\n法律上の結論\nは出ない。\n例えば、\nAがBを殴った。\nという事実から、\n暴行なのか、傷害なのか、正当防衛なのか\nなどを法律上評価する必要がある。\n","43":"第43章　当てはめ\n当てはめとは、\n具体的事実が法律上の要件を満たすかを判断すること\nである。\n法律\n「Aという要件が必要」\n↓\n事実\n「実際にAがあった」\n↓\n要件充足\n↓\n法律効果\n","44":"第44章　法的三段論法\n法的三段論法は、\n法規範と具体的事実を結びつけて法律上の結論を導く思考方法\nである。\n大前提\n法律のルール\n小前提\n具体的事実\n結論\n法律効果\n大前提\n「XならY」\n小前提\n「AはXである」\n結論\n「AにはYが生じる」\n","45":"第45章　法的三段論法の具体例\n例えば、\n他人の物を故意に壊した者は損害賠償責任を負う。\nというルールがあるとする。\nAが、\nBの所有する時計を故意に壊した。\nなら、\n大前提\n故意に他人の物を壊す\n→\n損害賠償責任\n小前提\nAはBの時計を故意に壊した\n結論\nAはBに損害賠償責任を負う\nとなる。\n","46":"第46章　法律問題では「要件」を探す\n法律を読むとき、\n結論だけを探してはいけない。\nまず、\nその結論が発生するための要件\nを探す。\n法律効果\n↓\n何が必要？\n↓\n要件\n↓\n具体的事実\n↓\n満たしている？\n","47":"第47章　法律効果\n法律効果とは、\n法律上発生する権利・義務・地位その他の法的結果\nである。\n例えば、\n• 契約成立\n• 損害賠償義務\n• 取消し\n• 解除\n• 刑罰\n• 行政処分\nなど。\n","48":"第48章　要件事実\n要件事実とは、\nある法律効果を発生させるために、法律上必要となる具体的事実\nである。\n例えば、\n損害賠償請求\n↓\n一定の要件\n↓\n故意・過失\n＋\n権利侵害等\n＋\n損害\n＋\n因果関係\nというように、\n法律効果を導くために必要な事実を整理する。\n","49":"第49章　法適用と証拠\n裁判では、\n「その事実が本当にあったのか」\nが問題になる。\nそこで、\n• 書類\n• 証言\n• 物\n• 電子データ\nなどの証拠によって事実を認定する。\n証拠\n↓\n事実認定\n↓\n要件への当てはめ\n↓\n法律効果\n","50":"第50章　法律解釈と事実認定の違い\nここは重要。\n法解釈\n法律の意味を明らかにする。\n事実認定\n実際に何が起きたのかを確定する。\n当てはめ\n確定した事実が法律の要件を満たすか判断する。\n法解釈\n＋\n事実認定\n↓\n当てはめ\n↓\n結論\n","51":"第51章　法律問題を解く基本手順\n法律問題では、\n① 事実を読む\n↓\n② 法的問題を発見\n↓\n③ 関係する法分野を特定\n↓\n④ 適用法を探す\n↓\n⑤ 条文を確認\n↓\n⑥ 条文を解釈\n↓\n⑦ 要件を分解\n↓\n⑧ 事実を認定\n↓\n⑨ 当てはめ\n↓\n⑩ 法律効果\n↓\n⑪ 救済方法\nという流れで考える。\n","52":"第52章　法律の欠缺\n法律が、\nある問題について明確な規定を置いていない\n場合がある。\nこれを、\n法の欠缺\nという。\nこの場合、\n• 類推\n• 慣習\n• 一般原則\n• 他の法規範\nなどを用いて解決することが問題になる。\n","53":"第53章　類推適用による補充\n法律に明確な規定がない。\n↓\n似た制度の規定がある。\n↓\n両者の趣旨が共通する。\n↓\nその規定を類推適用できないか検討する。\nただし、\n類推適用が常に許されるわけではない。\n特に刑罰法規では、\n被告人に不利な類推による処罰範囲の拡張\nは許されない。\n","54":"第54章　法の一般原則\n具体的な条文だけで解決できない場合、\n法の一般原則\nが重要になることがある。\n例えば、\n• 信義則\n• 権利濫用禁止\n• 公序良俗\n• 平等\n• 適正手続\nなど。\nただし、\nどの原則をどのように使うか\nについては具体的な法分野ごとの検討が必要。\n","55":"第55章　法解釈の限界\n法解釈は、\n「裁判官が好きなように法律を作ること」\nではない。\n解釈には、\n• 文言\n• 体系\n• 趣旨\n• 立法目的\n• 憲法\n• 他の法規範\nなどによる制約がある。\nしたがって、\n解釈と立法は区別する。\n","56":"第56章　立法と解釈\n立法\n新しいルールを制定する。\n解釈\n既に存在する法規範の意味を明らかにする。\n国会\n↓\n立法\n↓\n法律\n裁判所\n↓\n解釈・適用\n↓\n具体的事件\nもちろん、\n判例によって法解釈が発展する\nことはある。\n","57":"第57章　判例の読み方\n判例を読むときは、\n① どんな事実だったか\n↓\n② 何が争われたか\n↓\n③ どの条文が問題になったか\n↓\n④ 裁判所はどう判断したか\n↓\n⑤ なぜそう判断したか\n↓\n⑥ その判断はどんな事件に使えるか\nを見る。\n","58":"第58章　判例の「結論」だけを覚えない\n例えば、\n「最高裁はAと判断した」\nだけでは不十分。\n重要なのは、\nなぜAと判断したのか\nである。\n事実\n↓\n争点\n↓\n規範\n↓\n理由\n↓\n結論\nという構造で覚える。\n","59":"第59章　法源から法適用まで\nここまでを一つにつなげる。\n法源\n↓\n憲法・法律・命令・条例・慣習等\n↓\n適用される法規範を発見\n↓\n条文・判例等を確認\n↓\n法解釈\n↓\n要件を整理\n↓\n事実認定\n↓\n当てはめ\n↓\n法律効果\n↓\n救済\nこれが法律学の基本的な流れ。\n","60":"第60章　総合事例①――契約\nAがBから商品を購入した。\nBが商品を引き渡さない。\nまず、\n民法上の売買契約\nを確認する。\n↓\n契約が成立しているか。\n↓\nBに引渡義務があるか。\n↓\n履行期が到来しているか。\n↓\n履行遅滞の要件を満たすか。\n↓\nどの法律効果が発生するか。\nという順番で考える。\n","61":"第61章　総合事例②――行政処分\n行政庁がAに不利益な処分をした。\nAが、\n「この処分は違法だ」\nと主張する。\nここでは、\n行政庁\n↓\nどんな処分？\n↓\n法律上の根拠は？\n↓\n要件を満たす？\n↓\n裁量はある？\n↓\n手続は適法？\n↓\n違法？\n↓\n取消訴訟等による救済\nと考える。\n","62":"第62章　総合事例③――犯罪\nAがBを殴って負傷させた。\n事実\n↓\nAがBを殴った\n↓\n刑法上のどの犯罪？\n↓\n構成要件\n↓\n違法性\n↓\n責任\n↓\n犯罪成立\n↓\n刑罰\nという順序で考える。\n","63":"第63章　総合事例④――法の抵触\n法律Aと命令Bの内容が矛盾している。\nこの場合、\n① 法形式を確認\n↓\n② 上位・下位関係を確認\n↓\n③ 命令の法律上の根拠を確認\n↓\n④ 委任の範囲を確認\n↓\n⑤ 抵触の有無を判断\n↓\n⑥ 必要なら裁判で争う\nという流れになる。\n","64":"第64章　第3編の基本公式\n法律を学ぶときは、\n「どこから来たルールか」→「何という意味か」→「この事実に当てはまるか」\nの3段階で考える。\n法源\n↓\n法解釈\n↓\n法適用\nさらに細かくすると、\n法源\n↓\n規範発見\n↓\n解釈\n↓\n要件分解\n↓\n事実認定\n↓\n当てはめ\n↓\n法律効果\n","65":"第65章　第3編の核心\n第3編の核心は、\n法律問題は「条文を知っているか」だけでは解けない。\n必要なのは、\n① 適用される法規範を見つける\n② その意味を解釈する\n③ 具体的事実を認定する\n④ 要件に当てはめる\n⑤ 法律効果を導く\nという一連の思考。\nつまり、\n法源 → 解釈 → 適用\nが法律学の基本動作になる。\n","66":"第66章　自己説明チェック\n以下を何も見ずに説明する。\n法源\n1. 法源とは何か。\n2. なぜ法源を学ぶのか。\n3. 成文法とは何か。\n4. 不文法とは何か。\n5. 成文法と不文法の違いは？\n6. 日本で成文法が重要なのはなぜか。\n7. 憲法は法体系の中でどのような位置にあるか。\n8. 法律とは何か。\n9. 命令とは何か。\n10. 政令とは何か。\n11. 省令とは何か。\n12. 条例とは何か。\n13. 法令の上下関係をどう考えるか。\n14. 委任立法とは何か。\n15. 委任立法にはなぜ限界があるか。\n16. 慣習法とは何か。\n17. 判例とは何か。\n18. 判例と法律は同じものか。\n法解釈\n19. なぜ法解釈が必要なのか。\n20. 文理解釈とは何か。\n21. 論理解釈とは何か。\n22. 目的論的解釈とは何か。\n23. 体系解釈とは何か。\n24. 反対解釈とは何か。\n25. 類推解釈とは何か。\n26. 拡張解釈とは何か。\n27. 縮小解釈とは何か。\n28. 反対解釈と類推解釈の違いは？\n29. なぜ刑法で不利な類推解釈が禁止されるのか。\n30. 法解釈にはどのような限界があるか。\n法の適用\n31. 法の適用とは何か。\n32. 事実認定とは何か。\n33. 法的評価とは何か。\n34. 当てはめとは何か。\n35. 法的三段論法とは何か。\n36. 大前提・小前提・結論とは何か。\n37. 要件とは何か。\n38. 法律効果とは何か。\n39. 要件事実とは何か。\n40. 証拠はなぜ必要なのか。\n41. 法解釈と事実認定の違いは？\n42. 法律問題を解く基本手順は？\n43. 法の欠缺とは何か。\n44. なぜ類推適用が問題になるのか。\n45. 立法と解釈の違いは？\n","67":"第67章　第3編最終整理\n① 法源\n法源\n│\n├─ 憲法\n├─ 法律\n├─ 命令\n│   ├─ 政令\n│   └─ 省令等\n├─ 条例\n├─ 慣習法等\n└─ 判例・法理\n↓\n② 法解釈\n条文\n↓\n文理解釈\n↓\n論理解釈\n↓\n目的・体系・制度趣旨\n↓\n必要に応じて\n類推・反対・拡張・縮小\n↓\n規範の意味を確定\n↓\n③ 法適用\n一般的な法規範\n↓\n具体的事実\n↓\n事実認定\n↓\n要件に当てはめ\n↓\n法律効果\n↓\n④ 救済\n法律効果\n↓\n権利侵害・紛争\n↓\n裁判・行政等\n↓\n権利実現・救済\n\n★ 第3編の最重要10ポイント\n1. 法源とは、法的判断の根拠となる法規範の形式・由来である。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。"}},"questions":{"1":{"1":[{"text":"法とは、\n社会における人々の行動や関係を「1」、国家などによって「2」\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n「3」\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n「4」","source":"法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する","answers":[{"n":1,"correct":"規律するための","options":["処罰するための","救済するための","規律するための","管理するための"]},{"n":2,"correct":"公的に認められた規範","options":["単なる習慣","個人的な価値判断","政治的な意見","公的に認められた規範"]},{"n":3,"correct":"利害が衝突する","options":["法律が成立する","利害が衝突する","裁判が確定する","権利が消滅する"]},{"n":4,"correct":"社会秩序を形成する","options":["刑罰を決定する","社会秩序を形成する","会社を設立する","契約を成立させる"]}]}],"2":[{"text":"もし社会に「1」がなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n「2」\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の「3」\nがある。","source":"もし社会に共通のルールがなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n争い\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の紛争を予防・解決する機能\nがある。","answers":[{"n":1,"correct":"共通のルール","options":["公的に認められた規範","共通のルール","規律するための","利害が衝突する"]},{"n":2,"correct":"争い","options":["規律するための","利害が衝突する","公的に認められた規範","争い"]},{"n":3,"correct":"紛争を予防・解決する機能","options":["利害が衝突する","紛争を予防・解決する機能","公的に認められた規範","規律するための"]}]}],"3":[{"text":"法には複数の目的がある。\n主なものは、\n1. 「1」\n2. 「2」\n3. 紛争の解決\n4. 公正・公平の実現\n5. 人権の ールが優先され、条文をどう解釈して具体的事件に適用するのか」\nを学ぶ。\nつまり、\n法とは何か\n↓\n法にはどんな種類があるか\n↓\n法はどこから来るのか\n↓\n法をどう解釈するのか\n↓\n具体的事件にどう適用するのか\nという、法律学の思考の流れへ進んでいく。","answers":[{"n":1,"correct":"特別法が一般法に優先する","options":["権利・義務の内容","法律が標準的なルールを用意する","特別法が一般法に優先する","商取引に関する特別なルール"]},{"n":2,"correct":"強行法規","options":["一般的な私人間ルール","法律による行政","消費者法","強行法規"]},{"n":3,"correct":"任意法規","options":["犯罪と刑罰、犯罪を処理する手続などを規律する法の総称","国内法と国際法","任意法規","特別法が一般法に優先する"]},{"n":4,"correct":"最高法規","options":["どの法律関係が存在するか","何と何を比較しているのか","最高法規","どの法秩序に属するか"]},{"n":5,"correct":"複数の法分野","options":["複数の法分野","国家内部で適用される法","実体法／手続法","国内法と国際法"]},{"n":6,"correct":"法体系の中で位置づけることが重要","options":["民法などの実体法","法体系の中で位置づけることが重要","国家権力を制限","他の法律との接点はないか"]}]}]},"3":{"1":[{"text":"第1章　「1」とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、「2」？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","source":"第1章　法源とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、どこから来たのか？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","answers":[{"correct":"法源","options":["法源","どこから来たのか","法律関係","法的責任"]},{"correct":"どこから来たのか","options":["どこから来たのか","法源","法律関係","法的責任"]}]}],"2":[{"text":"第2章　なぜ「2」を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n「1」\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","source":"第2章　なぜ法源を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n法的な根拠\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","answers":[{"correct":"法的な根拠","options":["法的な根拠","法源","法律関係","法的責任"]},{"correct":"法源","options":["法源","法的な根拠","法律関係","法的責任"]}]}],"3":[{"text":"第3章　「1」\n成文法とは、\n「2」\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","source":"第3章　成文法\n成文法とは、\n文章として明確な形式で制定された法\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","answers":[{"correct":"成文法","options":["成文法","文章として明確な形式で制定された法","法律関係","法的責任"]},{"correct":"文章として明確な形式 ","法的責任"]},{"correct":"法解釈の基準","options":["法解釈の基準","一定の解釈","法律関係","法的責任"]}]}],"23":[{"text":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n「1」\n↓\n判例\n↓\n「2」が明らかになる\nという関係が多い。\n","source":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n裁判所が解釈\n↓\n判例\n↓\n条文の具体的意味が明らかになる\nという関係が多い。\n","answers":[{"correct":"裁判所が解釈","options":["裁判所が解釈","条文の具体的意味","法律関係","法的責任"]},{"correct":"条文の具体的意味","options":["条文の具体的意味","裁判所が解釈","法律関係","法的責任"]}]}],"24":[{"text":"第24章　判例と法解釈\n法律には、\n「1」\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n「2」でどのような意味を持つか\nを判断する。\n","source":"第24章　判例と法解釈\n法律には、\n抽象的な文言\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n具体的事件でどのような意味を持つか\nを判断する。\n","answers":[{"correct":"抽象的な文言","options":["抽象的な文言","具体的事件","法律関係","法的責任"]},{"correct":"具体的事件","options":["具体的事件","抽象的な文言","法律関係","法的責任"]}]}],"25":[{"text":"第25章　法解釈とは何か\n法解釈とは、\n「1」\nである。\n単に、\n「2」\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","source":"第25章　法解釈とは何か\n法解釈とは、\n法規範の意味・内容を明らかにする作業\nである。\n単に、\n条文を読む\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","answers":[{"correct":"法規範の意味・内容を明らかにする作業","options":["法規範の意味・内容を明らかにする作業","条文を読む","法律関係","法的責任"]},{"correct":"条文を読む","options":["条文を読む","法規範の意味・内容を明らかにする作業","法律関係","法的責任"]}]}],"26":[{"text":"第26章　なぜ「2」が必要なのか\n法律の条文は、\nすべての「1」。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","source":"第26章　なぜ法解釈が必要なのか\n法律の条文は、\nすべての具体的事件を詳細に書いているわけではない。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","answers":[{"correct":"具体的事件を詳細に書いているわけではない","options":["具体的事件を詳細に書いているわけではない","法解釈","法律関係","法的責任"]},{"correct":"法解釈","options":["法解釈","具体的事件を詳細に書いているわけではない","法律関係","法的責任"]}]}],"27":[{"text":"第27章　「1」\n文理解釈とは、\n「2」を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","source":"第27章　文理解釈\n文理解釈とは、\n条文の文言・文章構造を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","answers":[{"correct":"文理解釈","options":["文理解釈","条文の文言・文章構造","法律関係","法的責任"]},{"correct":"条文の文言・文章構造","options":["条文の文言・文章構造","文理解釈","法律関係","法的責任"]}]}],"28":[{"text":"第28章　「1」\n論理解釈とは、\n条文の文言だけでなく、「2」などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","source":"第28章　論理解釈\n論理解釈とは、\n条文の文言だけでなく、制度・目的・他の条文との関係などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","answers":[{"correct":"論理解釈","options":["論理解釈","制度・目的・他の条文との関係","法律関係","法的責任"]},{"correct":"制度・目的・他の条文との関係","options":["制度・目的・他の条文との関係","論理解釈","法律関係","法的責任"]}]}],"29":[{"text":"第29章　「1」\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n「2」\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","source":"第29章　目的論的解釈\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n消費者保護という目的\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","answers":[{"correct":"目的論的解釈","options":["目的論的解釈","消費者保護という目的","法律関係","法的責任"]},{"correct":"消費者保護という目的","options":["消費者保護という目的","目的論的解釈","法律関係","法的責任"]}]}],"30":[{"text":"第30章　「1」\n体系解釈とは、\nその条文だけでなく、「2」から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","source":"第30章　体系解釈\n体系解釈とは、\nその条文だけでなく、法律全体・法体系との関係から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","answers":[{"correct":"体系解釈","options":["体系解釈","法律全体・法体系との関係","法律関係","法的責任"]},{"correct":"法律全体・法体系との関係","options":["法律全体・法体系との関係","体系解釈","法律関係","法的責任"]}]}],"31":[{"text":"第31章　「1」\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を「2」と考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","source":"第31章　反対解釈\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を適用しないと考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","answers":[{"correct":"反対解釈","options":["反対解釈","適用しない","法律関係","法的責任"]},{"correct":"適用しない","options":["適用しない","反対解釈","法律関係","法的責任"]}]}],"32":[{"text":"第32章　「1」\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n法律が規定\nBの場合\n↓\n条文には直接書いていない\n↓\nAとBの趣旨が実質的に同じ\n↓\n「2」を検討\n","source":"第32章　類推解釈\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n 。\nそのため、\n法律の文言・目的・「2」\nなどを慎重に検討する必要がある。\n","source":"第37章　法解釈と人権保障\n憲法上の人権に関わる場合、\n国家権力による人権制約\nが問題になる。\nそのため、\n法律の文言・目的・憲法との整合性\nなどを慎重に検討する必要がある。\n","answers":[{"correct":"国家権力による人権制約","options":["国家権力による人権制約","憲法との整合性","法律関係","法的責任"]},{"correct":"憲法との整合性","options":["憲法との整合性","国家権力による人権制約","法律関係","法的責任"]}]}],"38":[{"text":"第38章　法解釈と憲法\n法律の解釈は、\n「1」\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n「2」が可能か\nを検討することがある。\n","source":"第38章　法解釈と憲法\n法律の解釈は、\n憲法に適合するように行う\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n憲法適合的な解釈が可能か\nを検討することがある。\n","answers":[{"correct":"憲法に適合するように行う","options":["憲法に適合するように行う","憲法適合的な解釈","法律関係","法的責任"]},{"correct":"憲法適合的な解釈","options":["憲法適合的な解釈","憲法に適合するように行う","法律関係","法的責任"]}]}],"39":[{"text":"第39章　法の適用とは何か\n法の適用とは、\n「1」を「2」に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n「3」\n","source":"第39章　法の適用とは何か\n法の適用とは、\n一般的な法規範を具体的な事件・事実に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n法律効果\n","answers":[{"correct":"一般的な法規範","options":["一般的な法規範","具体的な事件・事実","法律効果","法律関係"]},{"correct":"具体的な事件・事実","options":["具体的な事件・事実","一般的な法規範","法律効果","法律関係"]},{"correct":"法律効果","options":["法律効果","一般的な法規範","具体的な事件・事実","法律関係"]}]}],"40":[{"text":"第40章　法適用の基本構造\n法の適用は、\n① 「1」\n↓\n② 「2」\n↓\n③ 「3」\n↓\n④ 「4」\n↓\n⑤ 法律効果を導く\nという流れになる。\n","source":"第40章　法適用の基本構造\n法の適用は、\n① 法規範を発見\n↓\n② 法規範を解釈\n↓\n③ 事実を確定\n↓\n④ 要件に当てはめる\n↓\n⑤ 法律効果を導く\nという流れになる。\n","answers":[{"correct":"法規範を発見","options":["法規範を発見","法規範を解釈","事実を確定","要件に当てはめる"]},{"correct":"法規範を解釈","options":["法規範を解釈","法規範を発見","事実を確定","要件に当てはめる"]},{"correct":"事実を確定","options":["事実を確定","法規範を発見","法規範を解釈","要件に当てはめる"]},{"correct":"要件に当てはめる","options":["要件に当てはめる","法規範を発見","法規範を解釈","事実を確定"]}]}],"41":[{"text":"第41章　「1」\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に「2」があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","source":"第41章　事実認定\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に意思の合致があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","answers":[{"correct":"事実認定","options":["事実認定"," る。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。","source":"第67章　第3編最終整理\n① 法源\n法源\n│\n├─ 憲法\n├─ 法律\n├─ 命令\n│   ├─ 政令\n│   └─ 省令等\n├─ 条例\n├─ 慣習法等\n└─ 判例・法理\n↓\n② 法解釈\n条文\n↓\n文理解釈\n↓\n論理解釈\n↓\n目的・体系・制度趣旨\n↓\n必要に応じて\n類推・反対・拡張・縮小\n↓\n規範の意味を確定\n↓\n③ 法適用\n一般的な法規範\n↓\n具体的事実\n↓\n事実認定\n↓\n要件に当てはめ\n↓\n法律効果\n↓\n④ 救済\n法律効果\n↓\n権利侵害・紛争\n↓\n裁判・行政等\n↓\n権利実現・救済\n\n★ 第3編の最重要10ポイント\n1. 法源とは、法的判断の根拠となる法規範の形式・由来である。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。","answers":[{"correct":"法源","options":["法源","法解釈","文理解釈","論理解釈"]},{"correct":"法解釈","options":["法解釈","法源","文理解釈","論理解釈"]},{"correct":"文理解釈","options":["文理解釈","法源","法解釈","論理解釈"]},{"correct":"論理解釈","options":["論理解釈","法源","法解釈","文理解釈"]},{"correct":"類推・反対・拡張・縮小","options":["類推・反対・拡張・縮小","法源","法解釈","文理解釈"]},{"correct":"事実認定","options":["事実認定","法源","法解釈","文理解釈"]},{"correct":"法律効果","options":["法律効果","法源","法解釈","文理解釈"]}]}]},"4":{"1":[{"text":"裁判とは、「具体的な紛争」について、「裁判所」が「法を解釈・適用」して判断する公的な手続である。例えば、A「100万円返してほしい」↓B「返す必要はない」↓紛争↓裁判所↓法を解釈↓「事実を認定」↓法律を適用↓「判決」","blanks":["具体的な紛争","裁判所","法を解釈・適用","事実を認定","判決"],"options":[["具体的な紛争","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"],["法を解釈・適用","紛争","裁判所","法解釈"],["事実を認定","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"2":[{"text":"人々の間で争いが生じたとき、「自分の力で解決する」ことを認めてしまうと、「力の強い者が勝つ社会」になってしまう。そこで、「国家」が「中立的な第三者」として紛争を解決する。これが裁判制度の重要な役割である。","blanks":["自分の力で解決する","力の強い者が勝つ社会","国家","中立的な第三者"],"options":[["自分の力で解決する","紛争","裁判所","法解釈"],["力の強い者が勝つ社会","紛争","裁判所","法解釈"],["国家","紛争","裁判所","法解釈"],["中立的な第三者","紛争","裁判所","法解釈"]]}],"3":[{"text":"私人が、「相手が悪いから自分で制裁する」ということを自由に行うことは、「原則として認められない」。例えば、AがBに100万円を貸した。Bが返さない。だからAがBの車を勝手に持っていく。ということは原則として許されない。権利がある↓「裁判等」によって実現↓必要に応じて「強制執行」という仕組みを利用する。","blanks":["原則として認められない","裁判等","強制執行"],"options":[["原則として認められない","紛争","裁判所","法解釈"],["裁判等","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"4":[{"text":"「司法」とは、具体的な法律上の争いについて、「法を適用して公権的に判断する国家作用」である。三権分立では、「立法」↓国会、「行政」↓内閣・行政機関、司法↓「裁判所」となる。","blanks":["司法","法を適用して公権的に判断する国家作用","立法","行政","裁判所"],"options":[["司法","紛争","裁判所","法解釈"],["法を適用して公権的に判断する国家作用","紛争","裁判所","法解釈"],["立法","紛争","裁判所","法解釈"],["行政","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"5":[{"text":"日本国「憲法76条1項」は、「司法権」が「裁判所」に属するという仕組みを定めている。したがって、法律上の争いを公権的に判断する中心的機関は裁判所である。","blanks":["憲法76条1項","司法権","裁判所"],"options":[["憲法76条1項","紛争","裁判所","法解釈"],["司法権","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"6":[{"text":"日本の裁判所には、「最高裁判所」・「高等裁判所」・「地方裁判所」・「家庭裁判所」・「簡易裁判所」がある。最高裁判所↓高等裁判所↓地方裁判所・家庭裁判所↓簡易裁判所という「審級制度」が基本になる。","blanks":["最高裁判所","高等裁判所","地方裁判所","家庭裁判所","簡易裁判所","審級制度"],"options":[["最高裁判所","紛争","裁判所","法解釈"],["高等裁判所","紛争","裁判所","法解釈"],["地方裁判所","紛争","裁判所","法解釈"],["家庭裁判所","紛争","裁判所","法解釈"],["簡易裁判所","紛争","裁判所","法解釈"],["審級制度","紛争","裁判所","法解釈"]]}],"7":[{"text":"最高裁判所は、日本の司法制度における「最上級の裁判所」である。最高裁判所には、法令の「憲法適合性」を最終的に判断する権限もある。","blanks":["最上級の裁判所","憲法適合性"],"options":[["最上級の裁判所","紛争","裁判所","法解釈"],["憲法適合性","紛争","裁判所","法解釈"]]}],"8":[{"text":"「高等裁判所」は、主として地方裁判所などの第一審判決に対する「控訴事件」を扱う。また、事件の種類によって異なる役割を持つ。","blanks":["高等裁判所","控訴事件"],"options":[["高等裁判所","紛争","裁判所","法解釈"],["控訴事件","紛争","裁判所","法解釈"]]}],"9":[{"text":"「地方裁判所」は、民事・刑事事件の「第一審」を中心に扱う裁判所である。重大な事件では、地方裁判所が第一審となることが多い。","blanks":["地方裁判所","第一審"],"options":[["地方裁判所","紛争","裁判所","法解釈"],["第一審","紛争","裁判所","法解釈"]]}],"10":[{"text":"「家庭裁判所」は、家族関係や「少年事件」などを扱う裁判所。例えば、離婚・親族関係の事件、相続に関する事件、少年事件など。","blanks":["家庭裁判所","少年事件"],"options":[["家庭裁判所","紛争","裁判所","法解釈"],["少年事件","紛争","裁判所","法解釈"]]}],"11":[{"text":"「簡易裁判所」は、比較的軽微な民事・刑事事件を扱う。特に民事では、「少額訴訟」などの制度もある。","blanks":["簡易裁判所","少額訴訟"],"options":[["簡易裁判所","紛争","裁判所","法解釈"],["少額訴訟","紛争","裁判所","法解釈"]]}],"12":[{"text":"「審級制度」とは、一つの事件について、一定の条件の下で上級裁判所に判断を求められる仕組みである。一般に、「第一審」↓「控訴」↓「第二審」↓「上告」↓「最高裁判所」という構造になる。","blanks":["審級制度","第一審","控訴","第二審","上告","最高裁判所"],"options":[["審級制度","紛争","裁判所","法解釈"],["第一審","紛争","裁判所","法解釈"],["控訴","紛争","裁判所","法解釈"],["第二審","紛争","裁判所","法解釈"],["上告","紛争","裁判所","法解釈"],["最高裁判所","紛争","裁判所","法解釈"]]}],"13":[{"text":"裁判官も判断を誤る可能性がある。そこで、「上級裁判所による審査」を認める。目的は、「判断の誤りを是正」する、「法解釈を統一」する、裁判の公正を確保することなど。","blanks":["上級裁判所による審査","判断の誤りを是正","法解釈を統一"],"options":[["上級裁判所による審査","紛争","裁判所","法解釈"],["判断の誤りを是正","紛争","裁判所","法解釈"],["法解釈を統一","紛争","裁判所","法解釈"]]}],"14":[{"text":"「民事裁判」とは、「私人間」の権利・義務などをめぐる紛争を解決する裁判である。例えば、「貸金返還」、「損害賠償」、土地所有権、契約違反など。","blanks":["民事裁判","私人間","貸金返還","損害賠償"],"options":[["民事裁判","紛争","裁判所","法解釈"],["私人間","紛争","裁判所","法解釈"],["貸金返還","紛争","裁判所","法解釈"],["損害賠償","紛争","裁判所","法解釈"]]}],"15":[{"text":"「原告」↓「請求」↓「被告」↓争う↓裁判所↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」","blanks":["原告","請求","被告","事実認定","法解釈","当てはめ","判決"],"options":[["原告","紛争","裁判所","法解釈"],["請求","紛争","裁判所","法解釈"],["被告","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"16":[{"text":"「原告」＝裁判を起こして請求する側。「被告」＝その請求を受ける側。ただし、刑事裁判の「「被告人」」とは区別する。","blanks":["原告","被告","被告人"],"options":[["原告","紛争","裁判所","法解釈"],["被告","紛争","裁判所","法解釈"],["被告人","紛争","裁判所","法解釈"]]}],"17":[{"text":"民事裁判では、原告が何を求めているのかが重要。例えば、「BはAに100万円を支払え」という請求。これを、「請求の趣旨」として整理する。","blanks":["請求の趣旨"],"options":[["請求の趣旨","紛争","裁判所","法解釈"]]}],"18":[{"text":"民事裁判では、当事者が主張する事実を裁判所が「証拠」等によって認定する。例えば、本当に100万円を貸したのか？を、「契約書」、「振込記録」、「メッセージ」、「証人」などから判断する。","blanks":["証拠","契約書","振込記録","メッセージ","証人"],"options":[["証拠","紛争","裁判所","法解釈"],["契約書","紛争","裁判所","法解釈"],["振込記録","紛争","裁判所","法解釈"],["メッセージ","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"]]}],"19":[{"text":"「刑事裁判」とは、犯罪を行ったとされる者について、「犯罪の成立」と「刑罰」などを判断する裁判である。基本的には、犯罪の疑い↓捜査↓「起訴」↓刑事裁判↓「有罪・無罪」等↓刑罰という流れになる。","blanks":["刑事裁判","犯罪の成立","刑罰","起訴","有罪・無罪"],"options":[["刑事裁判","紛争","裁判所","法解釈"],["犯罪の成立","紛争","裁判所","法解釈"],["刑罰","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"],["有罪・無罪","紛争","裁判所","法解釈"]]}],"20":[{"text":"「被疑者」＝犯罪をしたと疑われ、捜査の対象となっている者。「被告人」＝検察官から公訴を提起され、刑事裁判の対象となっている者。犯罪の疑い↓被疑者↓「起訴」↓被告人","blanks":["被疑者","被告人","起訴"],"options":[["被疑者","紛争","裁判所","法解釈"],["被告人","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"]]}],"21":[{"text":"「検察官」は、犯罪を捜査し、「公訴を提起」し、刑事裁判で「公判を維持」するなどの職務を担う。刑事手続では、国家による刑罰権の行使と深く関係する。","blanks":["検察官","公訴を提起","公判を維持"],"options":[["検察官","紛争","裁判所","法解釈"],["公訴を提起","紛争","裁判所","法解釈"],["公判を維持","紛争","裁判所","法解釈"]]}],"22":[{"text":"「警察」は、「犯罪の捜査」や公共の安全・秩序の維持などを担う。刑事事件では、警察↓捜査↓証拠収集等↓「検察」↓「起訴判断」という流れが基本になる。ただし、警察＝有罪を決める機関ではない。最終的な刑事裁判の判断は「裁判所」が行う。","blanks":["警察","犯罪の捜査","検察","起訴判断","裁判所"],"options":[["警察","紛争","裁判所","法解釈"],["犯罪の捜査","紛争","裁判所","法解釈"],["検察","紛争","裁判所","法解釈"],["起訴判断","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"23":[{"text":"「弁護士」は、当事者の権利・利益を法律上保護する専門家である。民事では、「原告・被告の代理人」などとして活動する。刑事では、「被告人の弁護人」として活動する。","blanks":["弁護士","原告・被告の代理人","被告人の弁護人"],"options":[["弁護士","紛争","裁判所","法解釈"],["原告・被告の代理人","紛争","裁判所","法解釈"],["被告人の弁護人","紛争","裁判所","法解釈"]]}],"24":[{"text":"「裁判官」は、具体的事件について「中立・公正」な立場から法を解釈・適用して判断する。したがって、原告の味方でも、被告の味方でもない。","blanks":["裁判官","中立・公正"],"options":[["裁判官","紛争","裁判所","法解釈"],["中立・公正","紛争","裁判所","法解釈"]]}],"25":[{"text":"裁判官は、外部から不当な影響を受けずに判断する必要がある。これを、「司法権の独立」・「裁判官の職権の独立」という観点から理解する。政治×圧力×当事者↓裁判官↓法に基づいて判断","blanks":["司法権の独立","裁判官の職権の独立"],"options":[["司法権の独立","紛争","裁判所","法解釈"],["裁判官の職権の独立","紛争","裁判所","法解釈"]]}],"26":[{"text":"「憲法82条」は、裁判の「対審及び判決を公開」する原則を定める。公開裁判には、「公正な裁判」、国民による監視、裁判への信頼という意味がある。","blanks":["憲法82条","対審及び判決を公開","公正な裁判"],"options":[["憲法82条","紛争","裁判所","法解釈"],["対審及び判決を公開","紛争","裁判所","法解釈"],["公正な裁判","紛争","裁判所","法解釈"]]}],"27":[{"text":"すべての裁判が、「無条件に公開」されるわけではない。憲法上、一定の場合には、「対審を非公開」とすることが認められている。ただし、「公開原則」そのものを軽視してよいわけではない。","blanks":["無条件に公開","対審を非公開","公開原則"],"options":[["無条件に公開","紛争","裁判所","法解釈"],["対審を非公開","紛争","裁判所","法解釈"],["公開原則","紛争","裁判所","法解釈"]]}],"28":[{"text":"「憲法31条」は、法律の定める「適正な手続」によらなければ刑罰などを科されないという考え方を示している。これが、「適正手続の保障」である。","blanks":["憲法31条","適正な手続","適正手続の保障"],"options":[["憲法31条","紛争","裁判所","法解釈"],["適正な手続","紛争","裁判所","法解釈"],["適正手続の保障","紛争","裁判所","法解釈"]]}],"29":[{"text":"刑事手続では、国家が強い権力を行使する。例えば、「逮捕」、「捜索」、「押収」、「勾留」、「刑罰」など。そこで、被疑者・被告人の「人権保障」が非常に重要になる。","blanks":["逮捕","捜索","押収","勾留","刑罰","人権保障"],"options":[["逮捕","紛争","裁判所","法解釈"],["捜索","紛争","裁判所","法解釈"],["押収","紛争","裁判所","法解釈"],["勾留","紛争","裁判所","法解釈"],["刑罰","紛争","裁判所","法解釈"],["人権保障","紛争","裁判所","法解釈"]]}],"30":[{"text":"逮捕や捜索・押収などについては、「裁判官」が発する「令状」が必要となる場合がある。警察・検察↓捜査↓令状が必要な場合↓裁判官↓令状↓「強制処分」。これは、捜査機関の権力を裁判官によってコントロールする仕組みである。","blanks":["令状","裁判官","強制処分"],"options":[["令状","紛争","裁判所","法解釈"],["裁判官","紛争","裁判所","法解釈"],["強制処分","紛争","裁判所","法解釈"]]}],"31":[{"text":"「逮捕」は、「被疑者」の身体を拘束する強制処分。原則として、「逮捕状」による逮捕が基本。ただし、「現行犯逮捕」など、憲法・刑事訴訟法上の例外がある。","blanks":["逮捕","被疑者","逮捕状","現行犯逮捕"],"options":[["逮捕","紛争","裁判所","法解釈"],["被疑者","紛争","裁判所","法解釈"],["逮捕状","紛争","裁判所","法解釈"],["現行犯逮捕","紛争","裁判所","法解釈"]]}],"32":[{"text":"「捜索」とは、人・場所・物などを探す強制処分。「押収」とは、物を強制的に取得・確保すること。「憲法35条」によって、住居・書類・所持品等について「令状主義」が保障される。","blanks":["捜索","押収","憲法35条","令状主義"],"options":[["捜索","紛争","裁判所","法解釈"],["押収","紛争","裁判所","法解釈"],["憲法35条","紛争","裁判所","法解釈"],["令状主義","紛争","裁判所","法解釈"]]}],"33":[{"text":"被疑者・被告人には、「自己に不利益な供述を強要されない権利」がある。これは、国家が自白を強制することを防ぐという重要な意味を持つ。","blanks":["自己に不利益な供述を強要されない権利"],"options":[["自己に不利益な供述を強要されない権利","紛争","裁判所","法解釈"]]}],"34":[{"text":"刑事裁判では、有罪判決が確定するまでは、被告人を犯罪者として扱うべきではないという考え方が重要になる。これを、「無罪推定」という。","blanks":["無罪推定"],"options":[["無罪推定","紛争","裁判所","法解釈"]]}],"35":[{"text":"裁判では、「事実認定」が必要になる。そのため、「書証」、「証人」、「物証」、「電磁的記録」などの証拠を用いる。証拠↓事実認定↓法律要件↓当てはめ↓判決","blanks":["事実認定","書証","証人","物証","電磁的記録"],"options":[["事実認定","紛争","裁判所","法解釈"],["書証","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"],["物証","紛争","裁判所","法解釈"],["電磁的記録","紛争","裁判所","法解釈"]]}],"36":[{"text":"「民事裁判」＝私人間紛争の解決、「原告・被告」、「民法等」、請求認容・棄却等。「刑事裁判」＝犯罪・刑罰の判断、「検察官・被告人」、「刑法等」、有罪・無罪等。国家刑罰権は民事では原則問題にならず、刑事では中心的問題。","blanks":["民事裁判","刑事裁判","原告・被告","検察官・被告人","民法等","刑法等"],"options":[["民事裁判","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["原告・被告","紛争","裁判所","法解釈"],["検察官・被告人","紛争","裁判所","法解釈"],["民法等","紛争","裁判所","法解釈"],["刑法等","紛争","裁判所","法解釈"]]}],"37":[{"text":"「行政事件」とは、「行政活動」をめぐる法律上の争いである。例えば、行政庁がAの営業許可を取り消した。Aが、「この取消しは違法だ」と争う。この場合、「行政事件訴訟」などが問題になる。","blanks":["行政事件","行政活動","行政事件訴訟"],"options":[["行政事件","紛争","裁判所","法解釈"],["行政活動","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"]]}],"38":[{"text":"「行政庁」↓「行政処分」↓国民↓「違法だ」↓「行政事件訴訟」↓「裁判所」↓適法・違法を判断","blanks":["行政庁","行政処分","行政事件訴訟","裁判所"],"options":[["行政庁","紛争","裁判所","法解釈"],["行政処分","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"39":[{"text":"両者は区別する。「民事事件」＝「私人間の法律関係」。「行政事件」＝行政庁の「公権力の行使」などをめぐる法律関係。ただし、国家が関係する事件がすべて行政事件になるわけではない。","blanks":["民事事件","私人間の法律関係","行政事件","公権力の行使"],"options":[["民事事件","紛争","裁判所","法解釈"],["私人間の法律関係","紛争","裁判所","法解釈"],["行政事件","紛争","裁判所","法解釈"],["公権力の行使","紛争","裁判所","法解釈"]]}],"40":[{"text":"裁判所は、条文をそのまま機械的に読むだけではない。必要に応じて、「文理解釈」、「論理解釈」、「体系解釈」、「目的論的解釈」などを用いる。第3編で学んだ、法解釈がここで実際に使われる。","blanks":["文理解釈","論理解釈","体系解釈","目的論的解釈"],"options":[["文理解釈","紛争","裁判所","法解釈"],["論理解釈","紛争","裁判所","法解釈"],["体系解釈","紛争","裁判所","法解釈"],["目的論的解釈","紛争","裁判所","法解釈"]]}],"41":[{"text":"裁判所は、何が実際に起きたのかを「証拠」等から判断する。主張↓証拠↓「事実認定」↓「法規範」↓「当てはめ」↓判決","blanks":["事実認定","証拠","法規範","当てはめ"],"options":[["事実認定","紛争","裁判所","法解釈"],["証拠","紛争","裁判所","法解釈"],["法規範","紛争","裁判所","法解釈"],["当てはめ","紛争","裁判所","法解釈"]]}],"42":[{"text":"「判決」とは、裁判所が事件について示す「公的な判断」である。民事事件では、原告の請求を認めるかどうかなどを判断する。刑事事件では、被告人が「有罪か無罪」かなどを判断する。","blanks":["判決","公的な判断","有罪か無罪"],"options":[["判決","紛争","裁判所","法解釈"],["公的な判断","紛争","裁判所","法解釈"],["有罪か無罪","紛争","裁判所","法解釈"]]}],"43":[{"text":"判決は、一定の期間内に「不服申立て」がなされなければ「確定」するなど、手続上の要件によって確定する。確定すると、原則としてその判断を前提として法律関係が処理される。","blanks":["確定","不服申立て"],"options":[["確定","紛争","裁判所","法解釈"],["不服申立て","紛争","裁判所","法解釈"]]}],"44":[{"text":"「確定判決」には、「既判力」という重要な効力がある。簡単にいうと、確定判決によって判断された事項について、当事者間で後から自由に争い直すことを制限する効力である。","blanks":["既判力","確定判決"],"options":[["既判力","紛争","裁判所","法解釈"],["確定判決","紛争","裁判所","法解釈"]]}],"45":[{"text":"判決が出ても、相手が「自発的に従わない」場合がある。例えば、「BはAに100万円を支払え」という判決が確定したのに、Bが払わない。そこで、「強制執行」が問題になる。判決↓相手が履行しない↓強制執行↓財産を差し押さえる等↓「権利実現」","blanks":["強制執行","自発的に従わない","権利実現"],"options":[["強制執行","紛争","裁判所","法解釈"],["自発的に従わない","紛争","裁判所","法解釈"],["権利実現","紛争","裁判所","法解釈"]]}],"46":[{"text":"重要なのは、裁判＝権利実現の最終段階ではない場合があること。紛争↓裁判↓判決↓確定↓「強制執行」↓権利実現。したがって、「裁判制度」と「執行制度」はつながっている。","blanks":["裁判制度","執行制度","強制執行"],"options":[["裁判制度","紛争","裁判所","法解釈"],["執行制度","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"47":[{"text":"紛争は、必ず裁判をしなければならないわけではない。例えば、「和解」、「調停」、「仲裁」、ADRなどがある。これらを、「裁判外紛争解決手続（ADR）」という。","blanks":["裁判外紛争解決手続（ADR）","和解","調停","仲裁"],"options":[["裁判外紛争解決手続（ADR）","紛争","裁判所","法解釈"],["和解","紛争","裁判所","法解釈"],["調停","紛争","裁判所","法解釈"],["仲裁","紛争","裁判所","法解釈"]]}],"48":[{"text":"「和解」とは、当事者が「互いに譲歩」するなどして紛争を解決すること。例えば、A「100万円全額払ってほしい」B「50万円なら払う」↓A・Bが「合意」↓50万円で解決ということがある。","blanks":["和解","互いに譲歩","合意"],"options":[["和解","紛争","裁判所","法解釈"],["互いに譲歩","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"]]}],"49":[{"text":"「調停」では、「第三者」が当事者の「話合い」を仲介する。裁判のように、裁判官が一方的に勝敗を決めることが中心ではない。A↘調停機関↗B↓話合い↓「合意」","blanks":["調停","第三者","話合い","合意"],"options":[["調停","紛争","裁判所","法解釈"],["第三者","紛争","裁判所","法解釈"],["話合い","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"]]}],"50":[{"text":"「仲裁」では、当事者が「合意」によって「第三者」に紛争の判断を委ねる。裁判とは異なる紛争解決制度である。特に、「国際商取引」などで利用されることがある。","blanks":["仲裁","合意","第三者","国際商取引"],"options":[["仲裁","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"],["第三者","紛争","裁判所","法解釈"],["国際商取引","紛争","裁判所","法解釈"]]}],"51":[{"text":"「裁判」＝裁判所等、公的裁判あり、手続ルールあり、判決等、話合いは必須ではない。「ADR」＝「調停人・「仲裁人」」等、制度によって異なる、比較的柔軟、制度により異なる、話合いが重視される場合が多い。","blanks":["裁判","ADR","調停人・仲裁人","仲裁人"],"options":[["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["調停人・仲裁人","紛争","裁判所","法解釈"],["仲裁人","紛争","裁判所","法解釈"]]}],"52":[{"text":"裁判所は、法律・命令・規則・処分等が「憲法」に適合するかを判断することがある。これを、「違憲審査」という。日本では、「具体的事件を前提とした司法審査」が基本である。","blanks":["違憲審査","憲法","具体的事件を前提とした司法審査"],"options":[["違憲審査","紛争","裁判所","法解釈"],["憲法","紛争","裁判所","法解釈"],["具体的事件を前提とした司法審査","紛争","裁判所","法解釈"]]}],"53":[{"text":"「司法」は、国会や内閣を無制限に支配する機関ではない。一方、国会・内閣の行為が法に反していないかを判断する役割も持つ。国会↓法律、内閣↓行政、裁判所↓法律を解釈・適用＋「違憲審査」","blanks":["司法","違憲審査"],"options":[["司法","紛争","裁判所","法解釈"],["違憲審査","紛争","裁判所","法解釈"]]}],"54":[{"text":"裁判所にも、何でも自由に判断できるわけではない。例えば、「司法権の範囲」、「法律上の争訟」、「当事者適格」、「原告適格」、「訴えの利益」などの問題がある。","blanks":["司法権の範囲","法律上の争訟","当事者適格","原告適格","訴えの利益"],"options":[["司法権の範囲","紛争","裁判所","法解釈"],["法律上の争訟","紛争","裁判所","法解釈"],["当事者適格","紛争","裁判所","法解釈"],["原告適格","紛争","裁判所","法解釈"],["訴えの利益","紛争","裁判所","法解釈"]]}],"55":[{"text":"裁判所が司法権を行使するためには、「法律上の争訟」であることが基本的に必要。簡単にいえば、当事者間の「具体的な権利・義務」などについて、「法を適用して解決できる争い」である。","blanks":["法律上の争訟","具体的な権利・義務","法を適用して解決できる争い"],"options":[["法律上の争訟","紛争","裁判所","法解釈"],["具体的な権利・義務","紛争","裁判所","法解釈"],["法を適用して解決できる争い","紛争","裁判所","法解釈"]]}],"56":[{"text":"「憲法32条」は、何人も裁判所において「裁判を受ける権利」を奪われないと定める。つまり、法的権利・利益が侵害された場合に、「裁判所による救済」を求めることができることが重要。","blanks":["憲法32条","裁判を受ける権利","裁判所による救済"],"options":[["憲法32条","紛争","裁判所","法解釈"],["裁判を受ける権利","紛争","裁判所","法解釈"],["裁判所による救済","紛争","裁判所","法解釈"]]}],"57":[{"text":"「紛争発生」↓当事者↓「裁判」または「ADR」↓裁判の場合は裁判所↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」↓確定↓必要に応じて「強制執行」","blanks":["紛争発生","裁判","ADR","事実認定","法解釈","当てはめ","判決","強制執行"],"options":[["紛争発生","紛争","裁判所","法解釈"],["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"58":[{"text":"AがBに100万円を貸した。Bが返さない。貸付↓返済期限↓Bが返さない↓Aが請求↓「民事裁判」↓「契約・証拠」を確認↓「法解釈・当てはめ」↓判決↓必要なら「強制執行」","blanks":["民事裁判","契約・証拠","法解釈・当てはめ","強制執行"],"options":[["民事裁判","紛争","裁判所","法解釈"],["契約・証拠","紛争","裁判所","法解釈"],["法解釈・当てはめ","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"59":[{"text":"AがBを殴り、Bが負傷した。「刑事」：「警察」↓捜査↓「検察」↓「起訴」↓「刑事裁判」↓有罪・無罪。「民事」：B↓Aに「損害賠償」請求↓民事裁判↓損害賠償。つまり、一つの事件に刑事・民事の両方が存在し得る。","blanks":["刑事","警察","検察","起訴","刑事裁判","民事","損害賠償"],"options":[["刑事","紛争","裁判所","法解釈"],["警察","紛争","裁判所","法解釈"],["検察","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["民事","紛争","裁判所","法解釈"],["損害賠償","紛争","裁判所","法解釈"]]}],"60":[{"text":"「行政庁」がAの営業許可を取り消した。Aが、「違法な処分だ」と主張。行政庁↓処分↓A↓取消しを求める↓「行政事件訴訟」↓裁判所↓「処分の適法性」を審査","blanks":["行政庁","行政事件訴訟","処分の適法性"],"options":[["行政庁","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"],["処分の適法性","紛争","裁判所","法解釈"]]}],"61":[{"text":"AとBが契約について争っている。A「契約した」B「契約していない」↓「契約書」↓「メール」↓「振込記録」↓「証人」↓裁判所が「事実認定」↓契約成立の「法律要件」を検討↓「当てはめ」↓「判決」","blanks":["契約書","メール","振込記録","証人","事実認定","法律要件","当てはめ","判決"],"options":[["契約書","紛争","裁判所","法解釈"],["メール","紛争","裁判所","法解釈"],["振込記録","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法律要件","紛争","裁判所","法解釈"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"62":[{"text":"裁判を理解する基本公式は、「紛争」 → 「手続」 → 「事実認定」 → 「法解釈」 → 「当てはめ」 → 「判決」 → 必要に応じて「執行」である。紛争↓誰が？↓何を求める？↓どの手続？↓どんな事実？↓どの法律？↓どんな要件？↓当てはめ↓判決↓執行","blanks":["紛争","手続","事実認定","法解釈","当てはめ","判決","執行"],"options":[["紛争","裁判所","法解釈","事実認定"],["手続","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"],["執行","紛争","裁判所","法解釈"]]}],"63":[{"text":"裁判の本質は、「具体的な紛争」について、裁判所が「法を解釈・適用」し、「公的な判断」を示すことである。そして裁判は、単に「勝ち・負け」を決める制度ではない。その背後には、「法の支配」、「人権保障」、紛争解決、「権利実現」、国家権力の統制という重要な役割がある。","blanks":["具体的な紛争","法を解釈・適用","公的な判断","法の支配","人権保障","権利実現"],"options":[["具体的な紛争","紛争","裁判所","法解釈"],["法を解釈・適用","紛争","裁判所","法解釈"],["公的な判断","紛争","裁判所","法解釈"],["法の支配","紛争","裁判所","法解釈"],["人権保障","紛争","裁判所","法解釈"],["権利実現","紛争","裁判所","法解釈"]]}],"64":[{"text":"「裁判」・司法：1.裁判とは何か。2.なぜ裁判が必要なのか。3.自力救済が原則として制限されるのはなぜか。4.司法とは何か。5.「司法権」とは何か。6.日本の裁判所には何があるか。7.最高裁判所の役割は？8.高等裁判所の役割は？9.地方裁判所の役割は？10.家庭裁判所の役割は？11.簡易裁判所の役割は？12.「審級制度」とは何か。13.なぜ審級制度が必要か。民事：14.「民事裁判」とは何か。15.原告と被告の違いは？16.請求とは何か。17.民事裁判で証拠が重要なのはなぜか。刑事：18.「刑事裁判」とは何か。19.被疑者と被告人の違いは？20.検察官の役割は？21.警察の役割は？22.弁護士の役割は？23.裁判官の役割は？24.「令状主義」とは何か。25.「黙秘権」とは何か。26.無罪推定とは何か。行政・違憲審査：27.「行政事件」とは何か。28.民事事件と行政事件の違いは？29.違憲審査とは何か。30.裁判所と三権分立はどう関係するか。判決・救済：31.判決とは何か。32.判決の確定とは何か。33.既判力とは何か。34.強制執行とは何か。35.裁判と強制執行はどうつながるか。36.ADRとは何か。37.和解とは何か。38.調停とは何か。39.仲裁とは何か。40.裁判とADRの違いは？","blanks":["裁判","司法権","審級制度","民事裁判","刑事裁判","行政事件","令状主義","黙秘権"],"options":[["裁判","紛争","裁判所","法解釈"],["司法権","紛争","裁判所","法解釈"],["審級制度","紛争","裁判所","法解釈"],["民事裁判","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["行政事件","紛争","裁判所","法解釈"],["令状主義","紛争","裁判所","法解釈"],["黙秘権","紛争","裁判所","法解釈"]]}],"65":[{"text":"①「紛争発生」＝権利・利益の対立↓紛争。②「解決方法」＝紛争から「裁判」または「ADR」（和解・調停・仲裁）。③裁判＝当事者↓主張↓証拠↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」。④判決後＝判決↓確定↓自発的履行または強制執行↓権利実現。第4編の最重要10ポイント：1.裁判は具体的な紛争について法を解釈・適用する公的手続。2.司法権は裁判所に属する。3.日本には最高裁判所・高等裁判所・地方裁判所・家庭裁判所・簡易裁判所がある。4.審級制度は裁判の誤りの是正や法解釈の統一に役立つ。5.民事裁判は私人間の権利・義務等の紛争を扱う。6.刑事裁判は犯罪の成立や刑罰などを判断する。7.行政事件は行政活動をめぐる法律上の争いを扱う。8.裁判では事実認定と法解釈を区別する。9.判決だけで権利が実現しない場合には強制執行が問題になる。10.裁判は法の支配・人権保障・紛争解決・権利実現を支える。第4編完成：第1編→第2編→第3編→第4編まで完成した。法とは何か→どんな種類があるか→どこから来るか→どう解釈するか→どう具体的事件に適用するか→争いになったらどう解決するか、までつながった。次の第5編では法律家がどう分析し、論点を発見し、条文・判例・事実を組み合わせて法的結論を出すのかを学ぶ。","blanks":["紛争発生","解決方法","裁判","ADR","事実認定","法解釈","当てはめ","判決"],"options":[["紛争発生","紛争","裁判所","法解釈"],["解決方法","紛争","裁判所","法解釈"],["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}]},"5":{"1":[{"text":"「法的思考」とは、具体的な事実を法律上の問題として整理し、適用される「法規範」を発見・解釈し、事実を「当てはめ」て結論を導く思考方法である。「何が、どの法律に違反し、どの「法律効果」が発生するのか」を考える。","blanks":["法的思考","法規範","当てはめ","法律効果"],"options":[["法的思考","法規範","要件","法律効果"],["法規範","法的思考","要件","法律効果"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"2":[{"text":"AがBから100万円を借りたが返さない。一般的には「借りたなら返すべき」と考えるが、「法的思考」では「金銭消費貸借契約」の成立、返済期限、「債務不履行」、Bが請求できる内容を検討する。","blanks":["法的思考","金銭消費貸借契約","債務不履行"],"options":[["法的思考","法規範","要件","法律効果"],["金銭消費貸借契約","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"]]}],"3":[{"text":"法律問題は、事実×法規範→法的結論として考える。「事実を確認」→「法的問題を発見」→「適用法規」を探す→「法解釈」→「法律要件」を整理→事実を「当てはめ」→「法律効果」→救済・手続、という順序で処理する。","blanks":["事実を確認","法的問題を発見","適用法規","法解釈","法律要件","当てはめ","法律効果"],"options":[["事実を確認","法的思考","法規範","要件"],["法的問題を発見","法的思考","法規範","要件"],["適用法規","法的思考","法規範","要件"],["法解釈","法的思考","法規範","要件"],["法律要件","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"4":[{"text":"「法的三段論法」では、「大前提」が法律・法規範、「小前提」が具体的事実、結論が「法律効果」である。法規範＋事実→当てはめ→法律効果という構造で考える。","blanks":["法的三段論法","大前提","小前提","法律効果"],"options":[["法的三段論法","法的思考","法規範","要件"],["大前提","法的思考","法規範","要件"],["小前提","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"5":[{"text":"法律を読むときは「要件」→「効果」で考える。要件は法律効果を発生させる条件、効果は要件を満たした場合の「法律上の結果」である。","blanks":["要件","効果","法律上の結果"],"options":[["要件","法的思考","法規範","法律効果"],["効果","法的思考","法規範","要件"],["法律上の結果","法的思考","法規範","要件"]]}],"6":[{"text":"法律家にとって重要なのは問題を見つけること。土地売買なら「契約成立」、「意思能力・行為能力」、「代理」、「錯誤」、「詐欺・強迫」、契約違反、「解除」、損害賠償請求などを考える。","blanks":["契約成立","意思能力・行為能力","代理","錯誤","詐欺・強迫","解除"],"options":[["契約成立","法的思考","法規範","要件"],["意思能力・行為能力","法的思考","法規範","要件"],["代理","法的思考","法規範","要件"],["錯誤","法的思考","法規範","要件"],["詐欺・強迫","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"]]}],"7":[{"text":"「論点」とは、「法的な判断が必要となる重要な問題点」である。「契約が成立したか」が争われれば契約成立の要件が論点になる。","blanks":["論点","法的な判断が必要となる重要な問題点"],"options":[["論点","法的思考","法規範","要件"],["法的な判断が必要となる重要な問題点","法的思考","法規範","要件"]]}],"8":[{"text":"事実を、「誰が」・「誰に」・何をした・何が起きた・どんな権利義務が問題か・「どの法律」が関係するか・「どの要件」が問題か、に分解して論点を発見する。","blanks":["誰が","誰に","どの法律","どの要件"],"options":[["誰が","法的思考","法規範","要件"],["誰に","法的思考","法規範","要件"],["どの法律","法的思考","法規範","要件"],["どの要件","法的思考","法規範","要件"]]}],"9":[{"text":"法律関係は、誰が誰に何を請求できるかで整理する。AがBに100万円を貸せば、Bには「返還義務」、Aには100万円の返還「請求権」がある。","blanks":["請求権","返還義務","返還請求権"],"options":[["請求権","法的思考","法規範","要件"],["返還義務","法的思考","法規範","要件"],["返還請求権","法的思考","法規範","要件"]]}],"10":[{"text":"民事事件では「請求権の発生根拠」を探す。「契約」、「不法行為」、「不当利得」、「物権」その他の法律上の原因などから請求権を考える。","blanks":["請求権の発生根拠","契約","不法行為","不当利得","物権"],"options":[["請求権の発生根拠","法的思考","法規範","要件"],["契約","法的思考","法規範","要件"],["不法行為","法的思考","法規範","要件"],["不当利得","法的思考","法規範","要件"],["物権","法的思考","法規範","要件"]]}],"11":[{"text":"法律問題は「「誰が」・「誰に」・「何を」・「なぜ」」で整理する。誰が＝権利者・義務者、誰に＝相手方、何を＝権利義務、なぜ＝発生根拠。","blanks":["誰が","誰に","何を","なぜ"],"options":[["誰が","法的思考","法規範","要件"],["誰に","法的思考","法規範","要件"],["何を","法的思考","法規範","要件"],["なぜ","法的思考","法規範","要件"]]}],"12":[{"text":"「事実」と「法的評価」を区別する。「AはBを殴った」は事実、「Aには不法行為責任がある」は法的評価。事実→法的評価→「法律効果」の順で考える。","blanks":["事実","法的評価","法律効果"],"options":[["事実","法的思考","法規範","要件"],["法的評価","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"13":[{"text":"「事実認定」とは、裁判で「何が起きたのか」を確定すること。本当にAがBを殴ったのかは事実認定の問題である。","blanks":["事実認定","何が起きたのか"],"options":[["事実認定","法的思考","法規範","要件"],["何が起きたのか","法的思考","法規範","要件"]]}],"14":[{"text":"「法律解釈」とは、その事実にどの法律をどう適用するかを考えること。「故意」とは何を意味するかは法律解釈の問題である。","blanks":["法律解釈"],"options":[["法律解釈","法的思考","法規範","要件"]]}],"15":[{"text":"「事実認定」は何が起きたかを「証拠・証言」等から判断し、「法律解釈」は法律が何を意味するかを「条文・判例」・法理から判断する。","blanks":["事実認定","法律解釈","証拠・証言","条文・判例"],"options":[["事実認定","法的思考","法規範","要件"],["法律解釈","法的思考","法規範","要件"],["証拠・証言","法的思考","法規範","要件"],["条文・判例","法的思考","法規範","要件"]]}],"16":[{"text":"「当てはめ」とは、「具体的事実」が「法律の要件」を満たすかを判断すること。事実と要件を結び付けて要件充足を説明する。","blanks":["当てはめ","法律の要件","具体的事実"],"options":[["当てはめ","法的思考","法規範","要件"],["法律の要件","法的思考","法規範","要件"],["具体的事実","法的思考","法規範","要件"]]}],"17":[{"text":"良い当てはめは「「要件」を満たす」とだけ書かず、「なぜ満たすのか」を事実に即して説明する。","blanks":["なぜ満たすのか","要件"],"options":[["なぜ満たすのか","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"]]}],"18":[{"text":"自分に有利な事情だけでなく、「錯誤」・「詐欺・強迫」など、契約を取り消せないかという反対事実も検討する。","blanks":["錯誤","詐欺・強迫"],"options":[["錯誤","法的思考","法規範","要件"],["詐欺・強迫","法的思考","法規範","要件"]]}],"19":[{"text":"法律家の思考では、「Aの主張」→「Bの反論」→「Aの再反論」→法的評価という構造を作り、一方的な結論を避ける。","blanks":["Aの主張","Bの反論","Aの再反論"],"options":[["Aの主張","法的思考","法規範","要件"],["Bの反論","法的思考","法規範","要件"],["Aの再反論","法的思考","法規範","要件"]]}],"20":[{"text":"複数の問題があるときは、「契約成立」→有効→「債務不履行」→「解除」→「損害賠償」など、重要な争点を整理する。","blanks":["契約成立","債務不履行","解除","損害賠償"],"options":[["契約成立","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"],["損害賠償","法的思考","法規範","要件"]]}],"21":[{"text":"すべての論点を同じ重さで扱わず、結論を左右する「重要論点」を優先する。契約自体が無効なら解除の細部を検討する意味がない場合がある。","blanks":["重要論点"],"options":[["重要論点","法的思考","法規範","要件"]]}],"22":[{"text":"法律問題は「前提問題」→「後続問題」の順に処理する。前の段階が否定されれば後ろの問題が不要になることがある。","blanks":["前提問題","後続問題"],"options":[["前提問題","法的思考","法規範","要件"],["後続問題","法的思考","法規範","要件"]]}],"23":[{"text":"何を実現したいかという「法律効果」から逆算し、何の権利か→「発生要件」は何か→事実は満たすか、と考える。","blanks":["法律効果","発生要件"],"options":[["法律効果","法的思考","法規範","要件"],["発生要件","法的思考","法規範","要件"]]}],"24":[{"text":"条文を読むときは、「主語」・「要件」・「効果」・「例外」を探す。「誰が→どの条件で→何を→どうする」という構造を見る。","blanks":["主語","要件","効果","例外"],"options":[["主語","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["効果","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"]]}],"25":[{"text":"法律には「原則」・「例外」・「ただし書」・「準用」・「委任」・「定義」などがある。条文を一文だけ切り取らず構造を読む。","blanks":["原則","例外","ただし書","準用","委任","定義"],"options":[["原則","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"],["ただし書","法的思考","法規範","要件"],["準用","法的思考","法規範","要件"],["委任","法的思考","法規範","要件"],["定義","法的思考","法規範","要件"]]}],"26":[{"text":"「定義規定」は特定の言葉の意味を定める規定。法律独自の定義があれば、その「法律上の定義」が重要になる。","blanks":["定義規定","法律上の定義"],"options":[["定義規定","法的思考","法規範","要件"],["法律上の定義","法的思考","法規範","要件"]]}],"27":[{"text":"条文は孤立せず、「基本規定」→「例外規定」→「特則」→「準用規定」→関連規定というネットワークで理解する。","blanks":["基本規定","例外規定","特則","準用規定"],"options":[["基本規定","法的思考","法規範","要件"],["例外規定","法的思考","法規範","要件"],["特則","法的思考","法規範","要件"],["準用規定","法的思考","法規範","要件"]]}],"28":[{"text":"「一般法」と「特別法」が同じ問題に関係する場合、原則として特別法が一般法に優先する。「民法」と「借地借家法」などが例。","blanks":["一般法","特別法","民法","借地借家法"],"options":[["一般法","法的思考","法規範","要件"],["特別法","法的思考","法規範","要件"],["民法","法的思考","法規範","要件"],["借地借家法","法的思考","法規範","要件"]]}],"29":[{"text":"法律問題では「原則」だけでなく「ただし」という「例外」を常に意識する。","blanks":["原則","例外"],"options":[["原則","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"]]}],"30":[{"text":"「判例」は裁判所が「具体的事件」について示した判断。法律が実際の事件でどう「解釈・適用」されるかを理解するために学ぶ。","blanks":["判例","具体的事件","解釈・適用"],"options":[["判例","法的思考","法規範","要件"],["具体的事件","法的思考","法規範","要件"],["解釈・適用","法的思考","法規範","要件"]]}],"31":[{"text":"判例は、「事案」→「争点」→当事者の主張→「裁判所の判断」→「理由」→「結論」、で整理すると分かりやすい。","blanks":["事案","争点","裁判所の判断","理由","結論"],"options":[["事案","法的思考","法規範","要件"],["争点","法的思考","法規範","要件"],["裁判所の判断","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"32":[{"text":"「原告敗訴」だけでは不十分。なぜ敗訴したのか、「規範」→「理由」→「当てはめ」→「結論」を見る。","blanks":["規範","理由","当てはめ","結論"],"options":[["規範","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"33":[{"text":"「判例の射程」とは、その判断がどのような「事案」にまで及ぶかという観点。事案が異なれば同じ結論とは限らない。","blanks":["判例の射程","事案"],"options":[["判例の射程","法的思考","法規範","要件"],["事案","法的思考","法規範","要件"]]}],"34":[{"text":"社会状況や法解釈の変化などにより裁判所が従来の判断を変更することがある。判例は永遠に固定されたルールではない。","blanks":[],"options":[]}],"35":[{"text":"社会的に望ましい結果だけで結論を出さず、まず「現行法」上どう評価されるかを検討し、その上で政策的・制度的問題を考える。","blanks":["現行法"],"options":[["現行法","法的思考","法規範","要件"]]}],"36":[{"text":"「法的安定性」とは、人々が法律関係を予測できること。同様の事案が毎回違う判断になれば社会は混乱する。","blanks":["法的安定性"],"options":[["法的安定性","法的思考","法規範","要件"]]}],"37":[{"text":"「具体的妥当性」とは、「個別具体的な事情」に応じた妥当な結論を重視すること。","blanks":["具体的妥当性","個別具体的な事情"],"options":[["具体的妥当性","法的思考","法規範","要件"],["個別具体的な事情","法的思考","法規範","要件"]]}],"38":[{"text":"法律学では「法的安定性」と「具体的妥当性」の「バランス」が重要で、どちらか一方だけでは不十分。","blanks":["法的安定性","具体的妥当性","バランス"],"options":[["法的安定性","法的思考","法規範","要件"],["具体的妥当性","法的思考","法規範","要件"],["バランス","法的思考","法規範","要件"]]}],"39":[{"text":"公平とは「同じものを同じように扱う」ことが重要だが、事情が異なるものまで無条件に同じ扱いにするとかえって不公平になる。","blanks":["同じものを同じように扱う"],"options":[["同じものを同じように扱う","法的思考","法規範","要件"]]}],"40":[{"text":"複数の利益が衝突する場合、「利益衡量」によりそれぞれを比較・調整することがある。「表現の自由」と「他人の名誉」などが例。ただし単純に大きい利益が勝つわけではない。","blanks":["利益衡量","表現の自由","他人の名誉"],"options":[["利益衡量","法的思考","法規範","要件"],["表現の自由","法的思考","法規範","要件"],["他人の名誉","法的思考","法規範","要件"]]}],"41":[{"text":"「比例原則的思考」では、公権力の制約について「目的」に対して「手段」が過大でないかを、目的→手段→「必要性」→「相当性」という視点から検討する。","blanks":["比例原則的思考","目的","手段","必要性","相当性"],"options":[["比例原則的思考","法的思考","法規範","要件"],["目的","法的思考","法規範","要件"],["手段","法的思考","法規範","要件"],["必要性","法的思考","法規範","要件"],["相当性","法的思考","法規範","要件"]]}],"42":[{"text":"「法的評価」とは、事実を法律上どのように評価するか。「Aの行為は「正当防衛」に当たる」は法的評価。","blanks":["法的評価","正当防衛"],"options":[["法的評価","法的思考","法規範","要件"],["正当防衛","法的思考","法規範","要件"]]}],"43":[{"text":"「証拠」→「事実認定」→「法的評価」→「法律効果」の順序を崩さない。事実を評価する前に、その事実が認定できるかを確認する。","blanks":["証拠","事実認定","法的評価","法律効果"],"options":[["証拠","法的思考","法規範","要件"],["事実認定","法的思考","法規範","要件"],["法的評価","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"44":[{"text":"法的文章の基本構造は、「問題提起」→「規範」→「理由」→「当てはめ」→「結論」。結論だけを書かない。","blanks":["問題提起","規範","理由","当てはめ","結論"],"options":[["問題提起","法的思考","法規範","要件"],["規範","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"45":[{"text":"「IRAC」は、I=「Issue」（問題点）、R=「Rule」（ルール）、A=「Application」（当てはめ）、C=「Conclusion」（結論）という実践的な型。","blanks":["IRAC","Issue","Rule","Application","Conclusion"],"options":[["IRAC","法的思考","法規範","要件"],["Issue","法的思考","法規範","要件"],["Rule","法的思考","法規範","要件"],["Application","法的思考","法規範","要件"],["Conclusion","法的思考","法規範","要件"]]}],"46":[{"text":"AがBを殴った事例では、「Issue」＝「不法行為責任」の成否、「Rule」＝不法行為の要件、「Application」＝Aの行為を要件に当てはめ、「Conclusion」＝要件を満たす限り損害賠償責任が成立する。","blanks":["Issue","Rule","Application","Conclusion","不法行為責任"],"options":[["Issue","法的思考","法規範","要件"],["Rule","法的思考","法規範","要件"],["Application","法的思考","法規範","要件"],["Conclusion","法的思考","法規範","要件"],["不法行為責任","法的思考","法規範","要件"]]}],"47":[{"text":"避けるべきなのは「感情論」、「結論だけ」、「条文の丸暗記」、「事実と評価の混同」。法的根拠と事実への適用を示す。","blanks":["感情論","結論だけ","条文の丸暗記","事実と評価の混同"],"options":[["感情論","法的思考","法規範","要件"],["結論だけ","法的思考","法規範","要件"],["条文の丸暗記","法的思考","法規範","要件"],["事実と評価の混同","法的思考","法規範","要件"]]}],"48":[{"text":"自分が好きな結論ではなく、「法的根拠」から導ける結論を探す。結論→理由→法的根拠→「事実」の関係を意識する。","blanks":["法的根拠","事実"],"options":[["法的根拠","法的思考","法規範","要件"],["事実","法的思考","法規範","要件"]]}],"49":[{"text":"高度な法律学では「自説」だけでなく「反対説」、「反対説の根拠」、問題点、「自説の優位性」まで検討し論証を強くする。","blanks":["自説","反対説","反対説の根拠","自説の優位性"],"options":[["自説","法的思考","法規範","要件"],["反対説","法的思考","法規範","要件"],["反対説の根拠","法的思考","法規範","要件"],["自説の優位性","法的思考","法規範","要件"]]}],"50":[{"text":"「学説」とは法律学者などが法律問題について示す「理論・見解」で、「判例」とは異なり裁判所の判断そのものではない。","blanks":["学説","理論・見解","判例"],"options":[["学説","法的思考","法規範","要件"],["理論・見解","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"]]}],"51":[{"text":"学説には法律の意味の理論的説明、判例分析、「問題点」の指摘、「新しい解釈」の提案などの役割がある。","blanks":["問題点","新しい解釈"],"options":[["問題点","法的思考","法規範","要件"],["新しい解釈","法的思考","法規範","要件"]]}],"52":[{"text":"法律学では「条文」・「判例」・「学説」・「事実への適用」を関連させる。ただし条文・判例・学説は同じ法的地位ではない。","blanks":["条文","判例","学説","事実への適用"],"options":[["条文","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["学説","法的思考","法規範","要件"],["事実への適用","法的思考","法規範","要件"]]}],"53":[{"text":"法律情報は信頼性を確認する。「憲法・法律」、「政令・省令」、「判例」、「公的資料」、基本書・専門書、解説記事等を区別し、一次的法源と解説を見分ける。","blanks":["憲法・法律","政令・省令","判例","公的資料"],"options":[["憲法・法律","法的思考","法規範","要件"],["政令・省令","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["公的資料","法的思考","法規範","要件"]]}],"54":[{"text":"法律問題の調査は、事実整理→法律上の問題への変換→「関係条文」→「関連判例」→「学説・解説」→当てはめ→結論の順に進める。","blanks":["関係条文","関連判例","学説・解説"],"options":[["関係条文","法的思考","法規範","要件"],["関連判例","法的思考","法規範","要件"],["学説・解説","法的思考","法規範","要件"]]}],"55":[{"text":"「お金を返してくれない」より「「金銭消費貸借」・「返還請求」・「弁済期」」のように「法律上の概念」へ変換して検索する方が有効。","blanks":["法律上の概念","金銭消費貸借","返還請求","弁済期"],"options":[["法律上の概念","法的思考","法規範","要件"],["金銭消費貸借","法的思考","法規範","要件"],["返還請求","法的思考","法規範","要件"],["弁済期","法的思考","法規範","要件"]]}],"56":[{"text":"複雑な事件は、「契約成立」・有効・「債務不履行」・「解除」・損害発生・「因果関係」・損害額など、「小さな問題に分解」する。","blanks":["小さな問題に分解","契約成立","債務不履行","解除","因果関係"],"options":[["小さな問題に分解","法的思考","法規範","要件"],["契約成立","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"],["因果関係","法的思考","法規範","要件"]]}],"57":[{"text":"法的思考の縦軸は、「法の目的」→「基本原理」→「条文」→「判例」→「具体的事実」→結論。","blanks":["法の目的","基本原理","条文","判例","具体的事実"],"options":[["法の目的","法的思考","法規範","要件"],["基本原理","法的思考","法規範","要件"],["条文","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["具体的事実","法的思考","法規範","要件"]]}],"58":[{"text":"法的思考の横軸は、「憲法」・「民法」・「商法」・「行政法」・「刑法」・「手続法」など複数分野を横断して考えること。","blanks":["憲法","民法","商法","行政法","刑法","手続法"],"options":[["憲法","法的思考","法 }],"66":[{"text":"法的思考の最終モデルは、①「事実」→②「問題発見」→③「法源」→④「解釈」→⑤「要件」→⑥「当てはめ」→⑦「法律効果」→⑧「救済」→⑨反論→⑩最終結論。","blanks":["事実","問題発見","法源","解釈","要件","当てはめ","法律効果","救済"],"options":[["事実","法的思考","法規範","要件"],["問題発見","法的思考","法規範","要件"],["法源","法的思考","法規範","要件"],["解釈","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"],["救済","法的思考","法規範","要件"]]}],"67":[{"text":"核心は結論を先に決めず、「法的根拠」→「要件」→「事実」→「当てはめ」→「法律効果」の順で考えること。日常的事実を法律上の概念へ変換する。","blanks":["法的根拠","要件","事実","当てはめ","法律効果"],"options":[["法的根拠","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["事実","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"68":[{"text":"「自己説明チェック」：法的思考、一般的思考との違い、「法的三段論法」、要件と効果、論点、論点発見、誰が・誰に・何を・なぜ、「事実認定」、「法律解釈」、法的評価、当てはめ、条文、一般法と特別法、原則と例外、判例、射程、学説、反論、反対説、法的安定性、具体的妥当性、利益衡量、比例原則、「IRAC」、問題分解、時系列、主体、法分野横断、民事・刑事・行政を説明する。","blanks":["自己説明チェック","法的三段論法","事実認定","法律解釈","IRAC"],"options":[["自己説明チェック","法的思考","法規範","要件"],["法的三段論法","法的思考","法規範","要件"],["事実認定","法的思考","法規範","要件"],["法律解釈","法的思考","法規範","要件"],["IRAC","法的思考","法規範","要件"]]}],"69":[{"text":"第5編最終整理：①「事実」整理→②法律問題発見→③「法源」→④「解釈」→⑤「要件」→⑥「当てはめ」→⑦「法律効果」→⑧「救済」・手続→⑨反論→⑩結論。最重要公式は、法源→解釈→要件→事実→当てはめ→法律効果→救済、そして「Issue」→Rule→Application→Conclusion。","blanks":["法源","解釈","要件","事実","当てはめ","法律効果","救済","Issue"],"options":[["法源","法的思考","法規範","要件"],["解釈","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["事実","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"],["救済","法的思考","法規範","要件"],["Issue","法的思考","法規範","要件"]]}]},"6":{"1":[{"text":"「法」は「社会」から切り離された存在ではない。社会に人が存在し、利益の対立・権利侵害・「紛争」が発生するからこそ、法が必要になる。人間社会→利益・価値観の対立→紛争→「ルールの必要性」→法。","blanks":["法","社会","紛争","ルールの必要性"],"options":[["法","法源","法の支配","法治主義"],["社会","法","法源","法の支配"],["紛争","法","法源","法の支配"],["ルールの必要性","法","法源","法の支配"]]}],"2":[{"text":"「法」は人々の「行動」を一定の範囲で規律する。契約・所有・婚姻・相続・犯罪・税・行政など、「社会生活の基本的ルール」として機能する。","blanks":["法","行動","社会生活の基本的ルール"],"options":[["法","法源","法の支配","法治主義"],["行動","法","法源","法の支配"],["社会生活の基本的ルール","法","法源","法の支配"]]}],"3":[{"text":"法は既存の社会を維持するだけではない。「法改正」によって社会そのものを変化させることもある。「社会問題」→政治的議論→法改正→「新しいルール」→「社会の変化」。","blanks":["法改正","社会問題","新しいルール","社会の変化"],"options":[["法改正","法","法源","法の支配"],["社会問題","法","法源","法の支配"],["新しいルール","法","法源","法の支配"],["社会の変化","法","法源","法の支配"]]}],"4":[{"text":"近代「国家」では国家が「法を制定・執行」する。しかし国家だから何をしてもよいわけではない。ここで重要になるのが「法の支配」である。","blanks":["国家","法を制定・執行","法の支配"],"options":[["国家","法","法源","法の支配"],["法を制定・執行","法","法源","法の支配"],["法の支配","法","法源","法治主義"]]}],"5":[{"text":"「「法」の支配」とは、「国家権力」も法に従わなければならないという考え方。国民→法→国家権力という構造を持つ。","blanks":["法の支配","国家権力","法"],"options":[["法の支配","法","法源","法治主義"],["国家権力","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"6":[{"text":"「法治主義」は、「行政」などの国家活動を法に基づいて行わせるという考え方。特に行政法では、行政活動と「法律」との関係が重要になる。","blanks":["法治主義","行政","法律"],"options":[["法治主義","法","法源","法の支配"],["行政","法","法源","法の支配"],["法律","法","法源","法の支配"]]}],"7":[{"text":"「法の支配」は、「国家権力」による人権侵害を防ぐ役割を持つ。国家権力→法による制限→「人権保障」。","blanks":["法の支配","国家権力","人権保障"],"options":[["法の支配","法","法源","法治主義"],["国家権力","法","法源","法の支配"],["人権保障","法","法源","法の支配"]]}],"8":[{"text":"日本の法秩序では、「憲法」が「最高法規」である。憲法→「法律」→「政令・省令」等→個別の行政行為等という基本的な上下関係がある。","blanks":["憲法","最高法規","法律","政令・省令"],"options":[["憲法","法","法源","法の支配"],["最高法規","法","法源","法の支配"],["法律","法","法源","法の支配"],["政令・省令","法","法源","法の支配"]]}],"9":[{"text":"「基本的人権」は国家から与えられる単なる恩恵ではない。憲法によって、「国家権力」から「尊重・保障」されるべき基本的権利として位置づけられている。","blanks":["基本的人権","国家権力","尊重・保障"],"options":[["基本的人権","法","法源","法の支配"],["国家権力","法","法源","法の支配"],["尊重・保障","法","法源","法の支配"]]}],"10":[{"text":"「自由」とは何をしてもよいという意味ではない。「他人の権利」や社会秩序との関係で一定の「法的制約」を受ける。自分の自由↕他人の権利↕「公共的利益」。","blanks":["自由","他人の権利","公共的利益","法的制約"],"options":[["自由","法","法源","法の支配"],["他人の権利","法","法源","法の支配"],["公共的利益","法","法源","法の支配"],["法的制約","法","法源","法の支配"]]}],"11":[{"text":"法は人を不合理に差別してはならないという「平等原則」とも関係する。すべての人を常に完全に同じ扱いにすることが平等とは限らず、「合理的な区別」か「不合理な差別」かが重要である。","blanks":["平等原則","合理的な区別","不合理な差別"],"options":[["平等原則","法","法源","法の支配"],["合理的な区別","法","法源","法の支配"],["不合理な差別","法","法源","法の支配"]]}],"12":[{"text":"法学では「法律に従っていれば、それだけで「正義」なのか」という問題が生じる。正義・「公平」・「自由」・「平等」・「安全」・「社会秩序」などの価値が関係する。","blanks":["正義","公平","自由","平等","安全","社会秩序"],"options":[["正義","法","法源","法の支配"],["公平","法","法源","法の支配"],["自由","法","法源","法の支配"],["平等","法","法源","法の支配"],["安全","法","法源","法の支配"],["社会秩序","法","法源","法の支配"]]}],"13":[{"text":"「形式的正義」とは、「同じルールを同じように適用」するという側面。同じ条件の人には同じルールを適用する。「法的安定性」とも関係する。","blanks":["形式的正義","同じルールを同じように適用","法的安定性"],"options":[["形式的正義","法","法源","法の支配"],["同じルールを同じように適用","法","法源","法の支配"],["法的安定性","法","法源","法の支配"]]}],"14":[{"text":"「実質的正義」は、結果や「実質的な公平」にも目を向ける。表面的には同じ扱いでも、実際には著しく不公平という場合がある。","blanks":["実質的正義","実質的な公平"],"options":[["実質的正義","法","法源","法の支配"],["実質的な公平","法","法源","法の支配"]]}],"15":[{"text":"法は「正義」を実現するための重要な手段である。しかし法律と正義が常に完全に一致するとは限らない。だからこそ「法改正」・「違憲審査」・「司法判断」・「学説」などが存在する。","blanks":["正義","法改正","違憲審査","司法判断","学説"],"options":[["正義","法","法源","法の支配"],["法改正","法","法源","法の支配"],["違憲審査","法","法源","法の支配"],["司法判断","法","法源","法の支配"],["学説","法","法源","法の支配"]]}],"16":[{"text":"「倫理」とは、人間が「「何が正しいか」」を考える規範である。「法」と倫理は重なる部分があるが、完全に同じではない。","blanks":["倫理","何が正しいか","法"],"options":[["倫理","法","法源","法の支配"],["何が正しいか","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"17":[{"text":"困っている人を助けることは「道徳」的に望ましい。しかしすべての場面で「法」律上の義務になるとは限らない。道徳≠法。","blanks":["道徳","法"],"options":[["道徳","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"18":[{"text":"宗教も人々の行動規範となる。しかし日本国憲法では「信教の自由」が保障され、「国家と宗教」との関係にも一定の制約がある。","blanks":["信教の自由","国家と宗教"],"options":[["信教の自由","法","法源","法の支配"],["国家と宗教","法","法源","法の支配"]]}],"19":[{"text":"経済活動には「契約」・「所有権」・「会社」・金融・「消費者保護」・「労働」・「税」など、多くの法制度が関係する。市場経済も「法的基盤」なしには成立しにくい。","blanks":["契約","所有権","会社","消費者保護","労働","税","法的基盤"],"options":[["契約","法","法源","法の支配"],["所有権","法","法源","法の支配"],["会社","法","法源","法の支配"],["消費者保護","法","法源","法の支配"],["労働","法","法源","法の支配"],["税","法","法源","法の支配"],["法的基盤","法","法源","法の支配"]]}],"20":[{"text":"民法では当事者が自由に契約を結ぶという考え方が重要。しかし完全に無制限ではなく、「法律上の制限」、「公序良俗」、「強行規定」、消費者保護等が関係する。","blanks":["法律上の制限","公序良俗","強行規定"],"options":[["法律上の制限","法","法源","法の支配"],["公序良俗","法","法源","法の支配"],["強行規定","法","法源","法の支配"]]}],"21":[{"text":"「所有権」は「財産」を支配する基本的な権利。しかし所有権も無制限の絶対的権利ではなく、法によって他人の権利や「公共的利益」との調整が行われる。","blanks":["所有権","財産","公共的利益"],"options":[["所有権","法","法源","法の支配"],["財産","法","法源","法の支配"],["公共的利益","法","法源","法の支配"]]}],"22":[{"text":"企業活動には「会社法」・「商法」・「民法」・「労働法」・「税法」・「独占禁止法」・金融関連法などが関係する。企業は法的主体として活動する。","blanks":["会社法","商法","民法","労働法","税法","独占禁止法"],"options":[["会社法","法","法源","法の支配"],["商法","法","法源","法の支配"],["民法","法","法源","法の支配"],["労働法","法","法源","法の支配"],["税法","法","法源","法の支配"],["独占禁止法","法","法源","法の支配"]]}],"23":[{"text":"「消費者」は企業と比べて情報・交渉力などで弱い立場になることがある。そこで「消費者契約法」などによって一定の「保護」が図られている。","blanks":["消費者","消費者契約法","保護"],"options":[["消費者","法","法源","法の支配"],["消費者契約法","法","法源","法の支配"],["保護","法","法源","法の支配"]]}],"24":[{"text":"労働関係では「労働者」と「使用者」の力関係が問題になる。そのため「労働条件」・「賃金」・「労働時間」・「解雇」・労働安全などについて法的規制が存在する。","blanks":["労働者","使用者","労働条件","賃金","労働時間","解雇"],"options":[["労働者","法","法源","法の支配"],["使用者","法","法源","法の支配"],["労働条件","法","法源","法の支配"],["賃金","法","法源","法の支配"],["労働時間","法","法源","法の支配"],["解雇","法","法源","法の支配"]]}],"25":[{"text":"「技術」が進歩すると、従来の法律では想定していなかった問題が生じる。「インターネット」・「SNS」・「AI」・仮想空間・「自動運転」・バイオテクノロジーなど。","blanks":["技術","インターネット","SNS","AI","自動運転"],"options":[["技術","法","法源","法の支配"],["インターネット","法","法源","法の支配"],["SNS","法","法源","法の支配"],["AI","法","法源","法の支配"],["自動運転","法","法源","法の支配"]]}],"26":[{"text":"「インターネット」では「名誉毀損」・「著作権」・「個人情報」・「プライバシー」・契約・犯罪など多数の法律問題が発生する。新しい技術だから別世界の法が適用されるわけではない。","blanks":["インターネット","名誉毀損","著作権","個人情報","プライバシー"],"options":[["インターネット","法","法源","法の支配"],["名誉毀損","法","法源","法の支配"],["著作権","法","法源","法の支配"],["個人情報","法","法源","法の支配"],["プライバシー","法","法源","法の支配"]]}],"27":[{"text":"「SNS」では「表現の自由」が重要になる一方、「名誉」・「プライバシー」・「著作権」・営業上の利益・他人の人格権などとの衝突も生じる。表現の自由と他人の権利の調整問題になる。","blanks":["SNS","表現の自由","名誉","プライバシー","著作権"],"options":[["SNS","法","法源","法の支配"],["表現の自由","法","法源","法の支配"],["名誉","法","法源","法の支配"],["プライバシー","法","法源","法の支配"],["著作権","法","法源","法の支配"]]}],"28":[{"text":"「AI」の発達によって「AIが行った行為について誰が「責任」を負うのか」という問題が生じる。AIによる誤情報・「著作権」・「個人情報」・「差別的出力」・製造物責任・契約責任などが問題になる。","blanks":["AI","責任","著作権","個人情報","差別的出力"],"options":[["AI","法","法源","法の支配"],["責任","法","法源"," let page="home";
let currentPart=0;
let currentChapter=0;
let blankIndex=0;
let answers=[];
let checked=false;

const app=document.getElementById("app");
const head=document.getElementById("head");
const back=document.getElementById("back");

function goBack(){
  if(page==="home") return;
  if(page==="parts"){page="home";}
  else if(page==="list"){page="parts";}
  else if(page==="quiz"){page="list";}
  render();
}

function home(){
  page="home";
  render();
}

function render(){
  back.style.visibility = page==="home" ? "hidden" : "visible";

  if(page==="home"){
    head.textContent="基礎法学 基礎本";
    app.innerHTML=`
      <div class="card">
        <div class="title">基礎法学 基礎本</div>
        <div class="sub">第一編〜第六編　章ごとの穴埋め問題で学習</div>
      </div>
      <div class="grid">
        ${(DATA.titles||[]).map((p,i)=>`
          <button class="part" onclick="openPart(${i})">${["第一編","第二編","第三編","第四編","第五編","第六編"][i]||("第"+(i+1)+"編")}<br>
          <span class="small">${(DATA.parts&&DATA.parts[i]&&DATA.parts[i][1])||""}</span></button>
        `).join("")}
      </div>`;
    return;
  }

  if(page==="parts"){
    home();
    return;
  }

  if(page==="list"){
    const titles=DATA.titles[currentPart]||[];
    head.textContent=["第一編","第二編","第三編","第四編","第五編","第六編"][currentPart]||"章一覧";
    app.innerHTML=`
      <div class="card">
        <div class="title">${head.textContent}</div>
        <div class="sub">${titles.length}章</div>
      </div>
      <div class="grid">
        ${titles.map((t,i)=>`
          <button class="chapter" onclick="openChapter(${currentPart},${i})">
            <span class="num">${i+1}</span><span>${escapeHtml(t)}</span>
          </button>`).join("")}
      </div>`;
    return;
  }

  if(page==="quiz"){
    renderQuiz();
  }
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function getQuestion(){
  const p=DATA.questions?.[String(currentPart+1)];
  return p?.[String(currentChapter+1)]?.[0] || null;
}

function openPart(p){
  currentPart=p;
  page="list";
  render();
}

function openChapter(p,i){
  currentPart=p;
  currentChapter=i;
  blankIndex=0;
  answers=[];
  checked=false;
  page="quiz";
  render();
}

function getBlankData(q, index){
  // 第1〜3編は answers[{correct, options}] 形式、
  // 第4〜6編は options[[...]] 形式のため、ここで統一する。
  if(Array.isArray(q.answers) && q.answers[index]){
    const a=q.answers[index];
    return {correct:a.correct, choices:Array.isArray(a.options)?a.options.slice():[]};
  }
  const opts=q.options||[];
  return {
    correct:Array.isArray(q.blanks||[]) ? (q.blanks||[])[index] : undefined,
    choices:Array.isArray(opts[index]) ? opts[index].slice() : (Array.isArray(opts)?opts.slice():[])
  };
}

function shuffleChoices(arr){
  const a=arr.slice();
  // 正解が毎回先頭に来ないよう、通常のFisher-Yatesでランダム化。
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function choiceValue(c){
  return (c&&typeof c==='object') ? (c.answer??c.text??c.value) : c;
}

function renderQuiz(){
  const q=getQuestion();
  if(!q){
    app.innerHTML='<div class="card"><div class="title">問題データがありません</div><div class="sub">この章の問題データを確認してください。</div></div>';
    return;
  }

  const blanks=Array.isArray(q.answers)
    ? q.answers.map(a=>a.correct)
    : (q.blanks||[]);
  const prompt=q.text||q.question||q.source||'';
  const current=blankIndex;
  const bd=getBlankData(q,current);
  let choices=shuffleChoices(bd.choices||[]);

  head.textContent=`第${currentPart+1}編・第${currentChapter+1}章`;

  let display=escapeHtml(prompt);
  const re=/「[^」]*」/g;
  let n=0;
  display=display.replace(re,(matched)=>{
    const idx=n++;
    if(idx>=blanks.length) return matched;
    return idx===current
      ? `<span class="blank">？</span>`
      : (answers[idx]!==undefined ? `<span class="blank">${escapeHtml(String(answers[idx]))}</span>` : `<span class="blank">　</span>`);
  });

  app.innerHTML=`
    <div class="card">
      <div class="small">第${currentChapter+1}章　${escapeHtml((DATA.titles[currentPart]||[])[currentChapter]||"")}</div>
      <div class="question">${display}</div>
      <div class="sub">空欄 ${current+1} / ${blanks.length}</div>
    </div>
    <div class="card" id="choices"></div>
  `;

  const box=document.getElementById('choices');
  if(!choices.length){
    box.innerHTML='<div class="sub">この空欄の選択肢がありません。</div>';
    return;
  }
  choices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=(String.fromCharCode(65+i))+'. '+String(choiceValue(c));
    b.onclick=()=>answer(i,choices);
    box.appendChild(b);
  });
}

function answer(i,choices){
  if(checked) return;
  const q=getQuestion();
  const blanks=Array.isArray(q.answers)
    ? q.answers.map(a=>a.correct)
    : (q.blanks||[]);
  const correct=blanks[blankIndex];
  const value=choiceValue(choices[i]);

  answers[blankIndex]=value;

  const buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach((b,j)=>{
    b.disabled=true;
    const v=choiceValue(choices[j]);
    if(j===i)b.classList.add('selected');
    if(String(v)===String(correct))b.classList.add('correct');
    if(j===i && String(v)!==String(correct))b.classList.add('wrong');
  });

  const ok=String(value)===String(correct);
  const box=document.getElementById('choices');
  const result=document.createElement('div');
  result.className='result '+(ok?'ok':'ng');
  result.innerHTML=(ok?'✓ 正解':'✕ 不正解')+'<br>正解：<b>'+escapeHtml(String(correct))+'</b>';

  const next=document.createElement('button');
  next.className='next';
  next.textContent=blankIndex < blanks.length-1 ? '次の空欄へ' : 'この章の結果を見る';
  next.onclick=()=>{
    if(blankIndex < blanks.length-1){
      blankIndex++;
      renderQuiz();
    }else{
      checked=true;
      showFinal();
    }
  };

  box.appendChild(result);
  box.appendChild(next);
}

function showFinal(){
  const q=getQuestion();
  const blanks=q.blanks||q.answers||[];
  const explanations=q.explanations||[];
  let score=0;
  const rows=blanks.map((c,i)=>{
    const ok=String(answers[i])===String(c);
    if(ok)score++;
    return `<div class="result ${ok?"ok":"ng"}">
      ${i+1}. ${ok?"○":"×"}　あなたの回答：${escapeHtml(String(answers[i]??""))}<br>
      正解：<b>${escapeHtml(String(c))}</b>
      ${explanations[i]?`<br>${escapeHtml(String(explanations[i]))}`:""}
    </div>`;
  }).join("");

  app.innerHTML=`
    <div class="card">
      <div class="title">結果</div>
      <div class="sub">${score} / ${blanks.length} 正解</div>
      ${rows}
      <button class="next" onclick="openChapter(${currentPart},${currentChapter})">もう一度</button>
      <button class="next" onclick="nextChapter()">次の章へ</button>
    </div>`;
}

function nextChapter(){
  const titles=DATA.titles[currentPart]||[];
  if(currentChapter < titles.length-1){
    openChapter(currentPart,currentChapter+1);
  }else if(currentPart < DATA.titles.length-1){
    openPart(currentPart+1);
  }else{
    home();
  }
}

render();
</script>
</body>
</html>
