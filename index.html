<script>
const DATA={"parts": [["第一編", "法とは何か・法の基本概念", 68]], "titles": ["法とは何か", "なぜ法が必要なのか", "法の基本的な目的", "法と社会", "法規範とは何か", "要件と効果", "法と権利", "権利の意味", "義務とは何か", "権利と義務の関係", "権利・義務と法律関係", "法律関係の基本構造", "法と道徳", "法と道徳の違い", "法と道徳は完全に別なのか", "法と慣習", "法と習慣", "法と社会規範", "法規範と他の社会規範", "法の強制力", "強制力と自発的遵守", "法的制裁", "法と国家", "法の支配", "法治主義", "法の支配と法治主義", "法の目的と正義", "形式的正義と実質的正義", "法と自由", "法と権利の保障", "法と義務の関係", "公法と私法", "実体法と手続法", "一般法と特別法", "特別法は一般法に優先する", "強行法規と任意法規", "強行法規と任意法規の例", "法の分類は何のためにあるのか", "法的主体とは何か", "自然人", "法人", "法人格", "法的主体と法的客体", "法律行為", "意思表示", "契約", "契約自由の原則", "法律上の責任", "法的責任と制裁", "法の適用", "法的三段論法への入口", "法律問題を考える基本順序", "法解釈への入口", "条文を読む基本", "法の実現", "法と裁判", "法と行政", "法と刑罰", "法と人権", "法の限界", "法と政治", "法と経済", "法と倫理", "法の基本構造", "法を理解する5つの視点", "第1編の核心", "自己説明チェック", "第1編最終整理"], "chapters": {"1": "法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する", "2": "もし社会に共通のルールがなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n争い\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の紛争を予防・解決する機能\nがある。", "3": "法には複数の目的がある。\n主なものは、\n1. 社会秩序の維持\n2. 権利・利益の保護\n3. 紛争の解決\n4. 公正・公平の実現\n5. 人権の保障\n6. 国家権力の統制\nである。\nしたがって、\n法＝単に人を縛るルール\nではない。\nむしろ、\n人々の自由や権利を保障するためにも法が存在する。", "4": "法は社会から切り離して存在するものではない。\n社会\n↓\n人々の生活・利害\n↓\n問題・紛争\n↓\n法によるルール形成\n↓\n社会秩序\n社会が変化すれば、\n必要とされる法も変化する。\n例えば、\n• インターネット\n• AI\n• 個人情報\n• 電子商取引\n• 環境問題\nなど、新しい社会問題が生じれば、それに対応する法制度も発展する。", "5": "法規範とは、\n人々の行為を一定の基準によって規律する法的なルール\nである。\n例えば、\n他人の物を勝手に奪ってはいけない。\nというルールがある。\n法規範は一般に、\n一定の要件\n↓\n一定の効果\nという構造を持つ。", "6": "法律を理解するうえで、\n要件と効果\nは非常に重要。\n要件\nその法律上の効果が発生するために必要な条件。\n効果\n要件が満たされた場合に発生する法律上の結果。\n例えば、\n契約が成立\n↓\n一定の要件を満たす\n↓\n契約上の権利・義務が発生\nという構造。\n法律を読むときは、\n「どんな場合に、何が起こるのか」\nを見る。", "7": "権利とは、\n法によって保護され、一定の利益を享受したり、他者に一定の行為を求めたりできる法的な地位\nと理解するとよい。\n例えば、\n売買契約が成立\n↓\n買主\n↓\n目的物を引き渡せと請求できる\nという場合、\n買主には引渡請求権がある。", "8": "権利には、\n「自分が何かをできる」\nだけではなく、\n「他人に何かを求められる」\nという側面もある。\n例えば、\nA\n↓\nBに100万円を貸す\n↓\n返済期限到来\n↓\nA\n↓\nBに返還を請求できる\nこのときAには、\n貸金返還請求権\nがある。", "9": "義務とは、\n法によって一定の行為をすること、またはしないことを要求される法的な拘束\nである。\n例えば、\nAがBから100万円を借りる\n↓\nA\n↓\n返還義務\n↓\nB\n↓\n返還請求権\nという関係になる。", "10": "権利と義務は、\n相互に対応することが多い。\n例えば、\nA\n貸金返還請求権\n↓\nB\n返還義務\nという関係。\nしたがって、\n「誰が権利者で、誰が義務者なのか」\nを確認することが法律関係を理解する基本になる。", "11": "法律関係とは、\n法によって規律された人と人との関係\nである。\n例えば、\n売買契約なら、\n売主\n↓\n目的物引渡義務\n買主\n↓\n代金支払義務\nという法律関係が発生する。", "12": "法律関係を考えるときは、\n① 誰が\n↓\n② 誰に対して\n↓\n③ 何を請求・要求できるか\n↓\n④ 何をする義務があるか\n↓\n⑤ その根拠となる法は何か\nを見る。\nこれが法律学の基本的な視点になる。", "13": "法と道徳は似ている部分がある。\n例えば、\n「人を傷つけてはいけない」\nという考えは、\n道徳にも法にも関係する。\nしかし、\n法＝道徳\nではない。\n法と道徳には違いがある。", "14": "法\n国家による公的な強制と結びつく。\n道徳\n社会的・個人的な価値判断や良心に基づく。\n例えば、\n「困っている人を助けるべきだ」\nというのは道徳上重要でも、\nすべての場合に国家が法的義務として強制するとは限らない。\nしたがって、\n道徳\n＝\n「人としてどうあるべきか」\n\n法\n＝\n「社会において何をすべきか・してはいけないかを公的に規律する」\nと考える。", "15": "完全に別ではない。\n実際には、\n道徳的価値が法律に取り込まれる\nことがある。\n例えば、\n• 殺人禁止\n• 窃盗禁止\n• 他人への損害賠償\n• 信義則\nなど。\nしたがって、\n法と道徳は区別されるが、相互に影響する。", "16": "社会では、\n長期間繰り返されている慣行\nが存在する。\nこれを、\n慣習\nという。\nただし、\nすべての慣習が法になるわけではない。\n一定の要件の下で法的効力が認められるものがある。", "17": "「習慣」と「法的な慣習」は区別する。\n習慣\n単に人々が繰り返している行動。\n慣習法\n一定の社会的慣行が、\n法として認められるもの。\nしたがって、\n繰り返されている\n≠\n必ず法になる", "18": "社会には法以外にも規範がある。\n例えば、\n• 道徳\n• 宗教\n• 慣習\n• 社会的ルール\n• 礼儀\nなど。\nこれらをまとめて、\n社会規範\nと考えることができる。\n社会規範\n│\n├─ 法\n├─ 道徳\n├─ 宗教\n├─ 慣習\n└─ 礼儀・社会的ルール", "19": "法　道徳　礼儀・慣習\n公的強制　強い　原則なし　原則なし\n国家による制度化　あり　原則なし　原則なし\n違反への制裁　法的制裁　道徳的非難等　社会的非難等\n目的　社会秩序・権利保障等　善悪・人格　社会生活の円滑化\nただし、\n現実には完全に切り分けられるわけではない。", "20": "法の重要な特徴の一つは、\n公的な強制力と結びついていること\nである。\n例えば、\n契約上の義務を履行しない\n↓\n裁判\n↓\n判決\n↓\n必要に応じて強制執行\nということが可能になる。", "21": "ただし、\n法＝常に国家が力で従わせる\nという意味ではない。\n多くの人は、\n法律だから守る\nという形で自発的に法に従っている。\nしたがって、\n法\n↓\nルールを設定\n↓\n通常は自発的に遵守\n↓\n違反\n↓\n必要に応じて公的強制\nという構造になる。", "22": "法に違反した場合、\n法的な不利益\nが発生することがある。\n例えば、\n刑事法\n犯罪\n↓\n刑罰\n民法\n契約違反\n↓\n損害賠償・履行請求・解除など\n行政法\n法令違反\n↓\n行政処分・行政上の義務履行確保など\nというように分野によって異なる。", "23": "現代国家では、\n法は国家権力とも密接に関係する。\n特に重要なのが、\n国家権力自身も法に従わなければならない\nという考え方。\nこれが、\n法の支配\nにつながる。", "24": "法の支配とは、\n国家権力を法によって拘束し、人権や自由を保障するという原理\nである。\n国家権力\n↓\n法によって拘束\n↓\n恣意的な権力行使を防止\n↓\n国民の権利・自由を保障\nこれは憲法と深く関係する。", "25": "法治主義とは、\n行政などの国家作用を法に基づいて行わせるという考え方\nである。\n特に行政法では、\n法律による行政\nという考え方が重要になる。", "26": "両者は似ているが、完全に同じではない。\n法治主義\n国家作用が法に従って行われることを重視する。\n法の支配\n法そのものが人権保障・権力統制を実現するものであることを重視する。\nしたがって、\n法治主義\n→ 「法に従って行政等を行う」\n\n法の支配\n→ 「国家権力そのものを法で拘束する」\nというイメージを持つ。", "27": "法には、\n正義・公平\nを実現する役割もある。\n例えば、\n同じ条件の人を合理的理由なく差別する\n↓\n不公平\nとなる。\nそこで法は、\n公平な扱い\nを実現しようとする。\nただし、\n「公平とは何か」\nについては社会によって議論が生じる。", "28": "形式的正義\n同じルールを同じように適用する。\n実質的正義\n個々の事情を考慮して、実質的に公平な結果を目指す。\n例えば、\n全員に同じルール\n↓\n形式的公平\n\n弱者への特別な保護\n↓\n実質的公平\nという違いがある。", "29": "法は自由を制限することがある。\n例えば、\n他人を傷つけてはいけない。\nというルール。\n一見すると、\n自由を制限している。\nしかし、\nもし他人を自由に傷つけられる社会なら、\n他人の自由も保障されない。\nしたがって法は、\n自由を制限することで、他者の自由を保障する\nという側面も持つ。", "30": "法は、\n権利を認めるだけではなく、その権利を実現する仕組み\nも用意する。\n例えば、\n権利侵害\n↓\n裁判\n↓\n判決\n↓\n強制執行\nという仕組み。\nしたがって、\n権利＋救済制度\nが重要になる。", "31": "権利には、\n対応する義務\nが存在することが多い。\n例えば、\nAの所有権\n↓\n他人が勝手に使用・侵害しない義務\nという関係。\nしたがって、\n権利保障は、他者に一定の義務を課すことによって実現される。", "32": "法を大きく分類すると、\n公法と私法\nという区分がある。\n公法\n国家・公共団体と私人、または国家機関相互の関係などを中心に規律する法。\n例：\n• 憲法\n• 行政法\n• 刑法\n私法\n私人相互の関係を中心に規律する法。\n例：\n• 民法\n• 商法\n• 会社法\nただし、\nこの分類は絶対的ではない。", "33": "もう一つ重要な分類が、\n実体法と手続法\nである。\n実体法\n権利・義務などの法律関係そのものを定める。\n例：\n民法、刑法など。\n手続法\n権利の実現や紛争解決の手続を定める。\n例：\n民事訴訟法、刑事訴訟法など。", "34": "法律には、\n一般法\nと、\n特別法\nという関係もある。\n例えば、\n一般的ルール\n↓\n民法\n\n特定の場面について特別ルール\n↓\n商法・会社法等\nという関係。", "35": "一般に、\n特別法は一般法に優先する\nという原則がある。\n例えば、\n一般的なルール\n↓\n特別な場面\n↓\n特別法が存在\n↓\n特別法を優先\nという考え方。\nただし、\n実際の適用では具体的な条文関係を確認する必要がある。", "36": "強行法規\n当事者が、\n「この法律は適用しない」\nと合意しても排除できない規定。\n任意法規\n当事者が別の内容を合意すれば、\nその合意を優先できる規定。", "37": "例えば、\n契約について法律が、\n「特別な合意がない場合はAとする」\nと定めているなら、\n当事者が、\n「Bとする」\nと合意できる場合がある。\nこれが任意規定。\n一方、\n公益や弱者保護などの観点から、当事者の合意によって変更できない\n場合には強行規定が問題になる。", "38": "法の分類は、\n単なる暗記のためではない。\n分類することで、\n「この法律はどのような目的・構造を持っているのか」\nを理解できる。\n公法・私法\n↓\n誰と誰の関係か\n\n実体法・手続法\n↓\n何を定める法か\n\n一般法・特別法\n↓\nどちらを優先するか\n\n強行法規・任意法規\n↓\n当事者が変更できるか", "39": "法的主体とは、\n法によって権利や義務の主体となることができる者\nである。\n代表的なのは、\n• 自然人\n• 法人\nである。", "40": "自然人とは、\n生身の人間\nのこと。\n民法では、\n人は権利能力を持つ\nというところから法律関係が始まる。", "41": "法人とは、\n法律によって法人格を認められた組織等\nである。\n例えば、\n• 株式会社\n• 一般社団法人\n• 一般財団法人\nなど。\n法人は、\n自然人ではないが、法によって権利義務の主体となる。", "42": "法人格とは、\n独立した権利・義務の主体として法律上扱われる資格\nである。\n例えば株式会社では、\n株主\n↓\n出資\n↓\n株式会社\n↓\n会社自身が権利・義務を持つ\nという構造になる。", "43": "法律関係では、\n主体\nと、\n客体\nを区別する。\n主体\n権利・義務の主体。\n客体\n権利の対象となるもの。\n例えば、\nAがBの土地を所有している。\nA\n↓\n権利主体\n\n所有権\n↓\n権利\n\n土地\n↓\n権利の客体\nとなる。", "44": "法律行為とは、\n当事者の意思表示によって法律上の効果を発生させる行為\nである。\n代表例は、\n契約\nである。\n売りたい\n＋\n買いたい\n↓\n意思の合致\n↓\n売買契約\n↓\n法律上の権利・義務", "45": "意思表示とは、\n一定の法律効果を発生させようとする意思を外部に表示すること\nである。\n例えば、\n「この土地を1,000万円で売ります」\nという意思表示。\n相手が、\n「買います」\nと応じれば、\n契約成立へ進む。", "46": "契約とは、\n当事者間の意思の合致によって成立する法律行為\nである。\n例えば売買契約なら、\n売主\n「売る」\n\n買主\n「買う」\n\n↓\n意思の合致\n↓\n売買契約\nとなる。", "47": "契約では、\n誰と契約するか\n\nどのような契約をするか\n\n契約するかどうか\nについて原則として自由が認められる。\nこれを、\n契約自由の原則\nという。\nただし、\n公序良俗・強行法規・消費者保護などによる制約\nがある。", "48": "法に違反した場合、\n法的責任\nが発生することがある。\n代表的には、\n民事責任\n損害賠償など。\n刑事責任\n刑罰など。\n行政上の責任・不利益\n行政処分など。\n法違反\n↓\nどの分野の問題か\n↓\n民事？\n刑事？\n行政？\n↓\n対応する責任を判断", "49": "責任と制裁は関連するが、\n完全に同じ概念ではない。\n例えば民事責任では、\n被害者の損害を回復する\nことが中心となる。\n刑事責任では、\n犯罪に対する刑罰\nが中心となる。\n行政法では、\n行政目的を実現するための処分\nなどが問題となる。", "50": "法律は、\n具体的な事実に適用\nされる。\n基本構造は、\n法律\n↓\n要件を確認\n↓\n具体的事実を確認\n↓\n要件に当てはめる\n↓\n法律効果を導く\nこれを、\n法の適用\nという。", "51": "法律学では、\n一般的な法規範\nと、\n具体的な事実\nを結びつけて結論を出す。\n基本的には、\n大前提\n↓\n法律のルール\n\n小前提\n↓\n具体的事実\n\n結論\n↓\n法律効果\nという構造。\nこれが、\n法的三段論法\nの基本である。", "52": "法律問題では、\n① 事実を確認\n↓\n② 問題となる法律関係を特定\n↓\n③ 適用される法律を探す\n↓\n④ 要件を確認\n↓\n⑤ 事実を要件に当てはめる\n↓\n⑥ 法律効果を判断\n↓\n⑦ 必要なら救済手段を確認\nという流れで考える。", "53": "法律の条文を読むだけでは、\n答えが一つに決まらない\n場合がある。\nそこで、\n法解釈\nが必要になる。\n法解釈とは、\n条文の意味・内容を明らかにする作業\nである。", "54": "条文を読むときは、\n「誰に対して、どんな場合に、何を認め、何を禁止し、どのような効果を発生させているのか」\nを見る。\n特に、\n• 主体\n• 要件\n• 効果\n• 例外\n• ただし書\n• 準用\nなどを確認する。", "55": "法は、\n条文を書くだけでは意味がない。\n法が実際に機能するには、\n法律\n↓\n行政\n↓\n裁判\n↓\n強制執行\n↓\n権利・義務の実現\nという仕組みが必要になる。", "56": "法に関する争いが発生した場合、\n裁判所\nが法を解釈・適用して判断する。\n例えば、\nAとBが争う\n↓\n裁判所\n↓\n事実認定\n↓\n法解釈\n↓\n法適用\n↓\n判決\nとなる。", "57": "行政も法に基づいて活動する。\n例えば、\n許可\n認可\n行政処分\nなど。\nしたがって、\n行政法では「行政がどのような根拠で、どこまで行動できるのか」\nが重要になる。", "58": "刑法では、\nどのような行為が犯罪になるのか\nを法律によって定める。\nそして、\n犯罪が成立した場合にどのような刑罰が科されるのか\nを定める。\nここでは、\n罪刑法定主義\nが重要になる。", "59": "法は、\n人権を保障するためにも存在する。\n特に憲法では、\n• 個人の尊重\n• 基本的人権\n• 法の下の平等\n• 表現の自由\n• 財産権\n• 適正手続\nなどが保障されている。\nつまり、\n法は国家権力から国民を守る役割も持つ。", "60": "法によって、\n社会のすべての問題を完全に解決できるわけではない。\n例えば、\n• 道徳\n• 人間関係\n• 個人の価値観\n• 政治的判断\n• 経済的問題\nなどは法だけでは処理できない。\nしたがって、\n法にはできることと、できないことがある。", "61": "法と政治は密接に関係する。\n例えば、\n政治\n↓\n社会の課題を発見\n↓\n政策を決定\n↓\n法律を制定\n↓\n行政が実施\n↓\n社会に影響\nという流れがある。\nただし、\n政治が決めれば何でも法律にできる\nわけではない。\n憲法による制約が存在する。", "62": "経済活動も法によって規律される。\n例えば、\n• 契約\n• 所有権\n• 会社\n• 株式\n• 金融\n• 消費者保護\n• 独占禁止\nなど。\nしたがって、\n法は経済活動のルールを作る役割も持つ。", "63": "倫理とは、\n「何が正しいのか」\n\n「人間はどう行動すべきか」\nという問題に関係する。\n法も倫理的価値から影響を受けるが、\n法律で規定されていないことがすべて倫理的に正しいわけではない。\n逆に、\n倫理的に問題があることがすべて違法とも限らない。", "64": "ここまでをまとめる。\n人間\n↓\n社会生活\n↓\n利害・紛争\n↓\n社会規範\n↓\n法\n↓\n権利・義務\n↓\n法律関係\n↓\n法的責任\n↓\n裁判・行政等による実現", "65": "法律を学ぶときは、次の5つを見る。\n① 主体\n誰が関係しているのか。\n② 客体\n何が問題になっているのか。\n③ 権利・義務\n誰が何を請求でき、誰が何をしなければならないのか。\n④ 要件・効果\nどの条件で、どの法律効果が発生するのか。\n⑤ 救済\n権利が侵害された場合、どうやって実現・回復するのか。\n主体\n↓\n客体\n↓\n権利・義務\n↓\n要件・効果\n↓\n救済", "66": "「法とは何か」を一言で表すなら、\n法とは、社会における人々の行動・権利・義務・責任を公的に規律し、社会秩序と権利保障を実現するための規範である。\nそして法律を理解するときは、\n誰が？\n↓\n誰との間で？\n↓\n何について？\n↓\nどんな権利・義務がある？\n↓\nどんな要件で？\n↓\nどんな効果が発生する？\n↓\n違反したらどうなる？\n↓\nどう救済する？\nと考える。", "67": "以下を何も見ずに説明してみる。\n1. 法とは何か。\n2. なぜ法が必要なのか。\n3. 法の目的は何か。\n4. 法規範とは何か。\n5. 要件と効果とは何か。\n6. 権利とは何か。\n7. 義務とは何か。\n8. 権利と義務はどう関係するか。\n9. 法律関係とは何か。\n10. 法と道徳の違いは何か。\n11. 法と慣習の違いは何か。\n12. 法と社会規範の関係は？\n13. 法の強制力とは何か。\n14. 法の支配とは何か。\n15. 法治主義とは何か。\n16. 法の支配と法治主義の違いは？\n17. 公法と私法の違いは？\n18. 実体法と手続法の違いは？\n19. 一般法と特別法の違いは？\n20. 強行法規と任意法規の違いは？\n21. 法的主体とは何か。\n22. 自然人と法人の違いは？\n23. 法人格とは何か。\n24. 法律行為とは何か。\n25. 意思表示とは何か。\n26. 契約とは何か。\n27. 契約自由の原則とは何か。\n28. 民事責任と刑事責任の違いは？\n29. 法の適用とは何か。\n30. 法的三段論法とは何か。\n31. 法解釈とは何か。\n32. 法と裁判はどう関係するか。\n33. 法と行政はどう関係するか。\n34. 法と人権はどう関係するか。\n35. 法にはどのような限界があるか。", "68": "① 法とは\n社会を規律する公的な規範\n↓\n② 法が必要な理由\n社会生活\n↓\n利害対立\n↓\n紛争\n↓\n共通ルールが必要\n↓\n法\n↓\n③ 法が守るもの\n社会秩序\n＋\n権利\n＋\n自由\n＋\n公平\n＋\n人権\n↓\n④ 法律関係\n主体\n↓\n権利・義務\n↓\n客体\n↓\n⑤ 法規範\n要件\n↓\n法律効果\n↓\n⑥ 法の実現\n法律\n↓\n行政・裁判\n↓\n必要に応じた強制\n↓\n権利・義務の実現\n↓\n⑦ 法的思考\n事実\n↓\n問題発見\n↓\n法規範\n↓\n要件\n↓\n当てはめ\n↓\n法律効果\n↓\n救済\n\n★ 第1編の最重要ポイント10\n1. 法は社会を規律する公的な規範である。\n2. 法には社会秩序を維持する機能がある。\n3. 法には権利・自由・人権を保障する機能もある。\n4. 権利には、それに対応する義務が存在することが多い。\n5. 法律関係では「誰が・誰に・何を請求できるか」を考える。\n6. 法規範は「要件→効果」という構造で理解すると分かりやすい。\n7. 法と道徳・慣習・社会規範は区別する。\n8. 法の支配は国家権力そのものを法によって拘束する考え方である。\n9. 法的主体には自然人や法人がある。\n10. 法律問題は「事実→法規範→要件→当てはめ→効果→救済」で考える。\n\n第1編 完成\n基礎法学では、ここから、\n第1編　法とは何か\n↓\n第2編　法の種類・法体系\n↓\n第3編　法源・法の適用・解釈\n↓\n第4編　裁判・司法制度・法的手続\n↓\n第5編　法的思考・法律学\n↓\n第6編　現代社会と法・基礎法学総整理\nという順番で進める。\n第1編で最も重要なのは、\n「法律を暗記する前に、法が何をしているのかを理解する」\nことである。\nこれが分かると、憲法・民法・行政法・刑法・商法・会社法を学んだときも、それぞれの法律が「誰の、どのような法律関係を、どのようなルールで規律しているのか」という共通の視点から見られるようになる。"}, "questions": {"1": [{"text": "法とは、\n社会における人々の行動や関係を「1」、国家などによって「2」\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n「3」\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n「4」", "source": "法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する", "answers": [{"n": 1, "correct": "規律するための", "options": ["処罰するための", "救済するための", "規律するための", "管理するための"]}, {"n": 2, "correct": "公的に認められた規範", "options": ["単なる習慣", "個人的な価値判断", "政治的な意見", "公的に認められた規範"]}, {"n": 3, "correct": "利害が衝突する", "options": ["法律が成立する", "利害が衝突する", "裁判が確定する", "権利が消滅する"]}, {"n": 4, "correct": "社会秩序を形成する", "options": ["刑罰を決定する", "社会秩序を形成する", "会社を設立する", "契約を成立させる"]}]}], "2": [{"text": "もし社会に「1」がなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n「2」\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の「3」\nがある。", "source": "もし社会に共通のルールがなければ、    <span class="tag">第一編・第${key}章</span>
   <h2>${esc(title)}</h2>
   <div class="progress"><div class="bar" style="width:${progress}%"></div></div>
   <p class="muted">空欄 ${Math.min(blankIndex+1,item.answers.length)} / ${item.answers.length}</p>
   <div>${markers}</div>
   <div class="qtext">${esc(item.text)}</div>
   ${!done?`<div class="question-note"><b>「${blankIndex+1}」の答えを選択</b></div><div class="opts">${opts}</div>`:''}
   ${result}
 </div>`;
}
function answer(i){
 const a=DATA.questions[ci+1][0].answers[blankIndex];
 answers[blankIndex]=a.options[i];
 blankIndex++;
 render();
}
function nextChapter(){
 if(ci+1<DATA.titles.length){openChapter(ci+1)}
 else{page="list";render()}
}
function goBack(){
 if(page==="quiz"){page="list";render()}
 else{page="home";render()}
}
render();
</script>
</body>
</html>
