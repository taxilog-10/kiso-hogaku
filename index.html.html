<style>

header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}main{max-width:760px;margin:auto;padding:14px 13px 60px}
button{font:inherit;border:0;border-radius:12px;padding:13px 14px;background:#fff;box-shadow:0 1px 5px #0001;font-weight:600}
.back{padding:8px 10px;font-size:13px}.hero,.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}
.grid{display:grid;gap:10px}.part,.chapter{display:flex;align-items:center;justify-content:space-between;text-align:left}
.chapter{gap:11px}.num{width:38px;height:38px;border-radius:10px;background:#eef1f4;display:grid;place-items:center;flex:none}
.muted{color:#6b7280;font-size:13px}.tag{display:inline-block;background:#eef1f4;border-radius:9px;padding:5px 9px;font-size:12px}
.qtext{font-size:19px;line-height:2;margin:16px 0 20px;white-space:pre-line}
.blank{font-weight:800}.question-note{padding:12px;border-radius:12px;background:#f0f2f5;margin-bottom:12px}
.opts{display:grid;gap:9px}.opt{text-align:left;background:#f8f9fa;border:1px solid #dfe3e8;box-shadow:none}
.opt:disabled{opacity:1}.opt.correct{border:2px solid #111}.opt.wrong{opacity:.45}
.result{margin-top:14px;padding:15px;border-radius:13px;background:#f0f2f5;line-height:1.8}
.ok{font-weight:800}.ng{font-weight:800}.source{margin-top:14px;padding:14px;border-left:4px solid #aaa;background:#fafafa;line-height:1.9}
.next{width:100%;margin-top:12px;background:#20242b;color:#fff}.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#222}
.warning{background:#fff4d6;border-radius:12px;padding:13px;line-height:1.7}
.flow{line-height:2.1;font-size:17px;background:#fafafa;padding:12px;border-radius:12px}
</style>
</head>
<body>

/* 現在この作業で実際に取得できている元本文。ここは創作せず、ユーザー提示本文をそのまま使用。 */
const QUESTIONS={
"1-1":[
 {text:"法とは、\n社会における人々の行動や関係を「①」するための、国家などによって公的に認められた「②」である。",
  answers:[
   {opts:["A. 規律","B. 処罰","C. 管理","D. 制限"],correct:0},
   {opts:["A. 法律","B. 規範","C. 制度","D. 慣習"],correct:1}
  ],
  source:"法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。"},
 {text:"人間が複数人で生活すると、\n* 何をして「①」のか\n* 何をしてはいけないのか\n* 誰が何を請求できるのか\n* 誰が責任を負うのか\nを決める必要がある。",
  answers:[
   {opts:["A. よい","B. いけない","C. 負う","D. 請求する"],correct:0}
  ],
  source:"人間が複数人で生活すると、\n* 何をしてよいのか\n* 何をしてはいけないのか\n* 誰が何を請求できるのか\n* 誰が責任を負うのか\nを決める必要がある。"},
 {text:"そこで「①」が必要になる。",
  answers:[
   {opts:["A. 道徳","B. 法","C. 慣習","D. 政治"],correct:1}
  ],
  source:"そこで法が必要になる。"},
 {text:"人間が社会で生活する\n↓\n「①」が衝突する\n↓\nルールが必要になる\n↓\n「②」によって規律する\n↓\n社会秩序を形成する",
  answers:[
   {opts:["A. 利害","B. 権利","C. 義務","D. 感情"],correct:0},
   {opts:["A. 道徳","B. 法","C. 慣習","D. 政治"],correct:1}
  ],
  source:"人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する"}
]};

let page="home",partIndex=0,chapterIndex=0,qIndex=0,blankIndex=0,answers=[];
const app=document.getElementById("app"),back=document.getElementById("back");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){back.style.display=page==="home"?"none":"block";if(page==="home")home();else if(page==="part")part();else chapter();}
function home(){app.innerHTML=`<div class="hero"><h2>読む → 思い出す → 1空欄ずつ回答 → 確認</h2><p class="muted">6編・393章の章構成を維持。各空欄は独立した選択肢から1つずつ回答する方式。</p></div><div class="grid">${PARTS.map((p,i)=>`<button class="card part" onclick="openPart(${i})"><span><b>${p[0]}</b><br><span class="muted">${p[1]}（${p[2]}章）</span></span><span>›</span></button>`).join("")}</div>`}
function openPart(i){partIndex=i;page="part";render()}
function part(){let ts=TITLES[partIndex+1]||[];app.innerHTML=`<div class="hero"><span class="tag">${PARTS[partIndex][0]}</span><h2>${PARTS[partIndex][1]}</h2><p class="muted">${ts.length}章</p></div><div class="grid">${ts.map((t,i)=>`<button class="card chapter" onclick="openChapter(${i})"><span class="num">${i+1}</span><span style="flex:1">${esc(t)}</span><span>›</span></button>`).join("")}</div>`}
function openChapter(i){chapterIndex=i;qIndex=0;blankIndex=0;answers=[];page="chapter";render()}
function chapter(){
 let title=(TITLES[partIndex+1]||[])[chapterIndex]||"";
 let key=`${partIndex+1}-${chapterIndex+1}`, qs=QUESTIONS[key]||[];
 if(!qs.length){app.innerHTML=`<div class="card"><span class="tag">${PARTS[partIndex][0]}・第${chapterIndex+1}章</span><h2>${esc(title)}</h2><div class="warning">この章の元本文は、現在取得できている資料には入っていません。本文を推測して問題を作らない仕様です。</div></div>`;return}
 let q=qs[qIndex],done=blankIndex>=q.answers.length;
 let marks=q.answers.map((_,i)=>`<span class="tag">${i<blankIndex?(answers[i]===q.answers[i].correct?"○":"×"):i===blankIndex?"回答中":"未回答"}</span>`).join(" ");
 let opts=!done?q.answers[blankIndex].opts.map((o,i)=>`<button class="opt" onclick="answer(${i})">${esc(o)}</button>`).join(""):"";
 let result=done?`<div class="result"><div class="score">${answers.filter((a,i)=>a===q.answers[i].correct).length} / ${q.answers.length} 正解</div>${q.answers.map((a,i)=>`<p>${i+1}：「${esc(q.answers[i].opts[a])}」 → ${a===q.answers[i].correct?"○ 正解":"× 不正解"}<br>正答：${esc(q.answers[i].opts[q.answers[i].correct])}</p>`).join("")}</div><div class="source"><b>答え合わせ・元の文章</b><br>${esc(q.source)}</div><button class="next" onclick="nextQ()">次の問題 →</button>`:"";
 app.innerHTML=`<div class="card"><span class="tag">${PARTS[partIndex][0]}・第${chapterIndex+1}章</span><h2>${esc(title)}</h2><div class="progress"><div class="bar" style="width:${((qIndex+(done?1:0))/qs.length)*100}%"></div></div><p class="muted">問題 ${qIndex+1} / ${qs.length}</p><div>${marks}</div><div class="qtext">${esc(q.text)}</div>${!done?`<div class="question-note"><b>「${blankIndex+1}」の答えを選択</b></div><div class="opts">${opts}</div>`:""}${result}</div>`;
}
function answer(i){answers[blankIndex]=i;blankIndex++;render()}
function nextQ(){let qs=QUESTIONS[`${partIndex+1}-${chapterIndex+1}`]||[];qIndex++;blankIndex=0;answers=[];if(qIndex>=qs.length){app.innerHTML=`<div class="card"><h2>第${chapterIndex+1}章 完了</h2><p>この章の問題は終了です。</p><button class="next" onclick="nextChapter()">次の章へ →</button></div>`}else render()}
function nextChapter(){if(chapterIndex+1<(TITLES[partIndex+1]||[]).length)openChapter(chapterIndex+1);else{page="part";render()}}
function goBack(){if(page==="chapter"){page="part";render()}else if(page==="part"){page="home";render()}else{page="home";render()}}
render();
</script>
</body>
</html>
