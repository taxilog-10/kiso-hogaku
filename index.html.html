「行政はどこまで法律なしに活動できるのか」
という問題につながる。
", "16": "第16章　委任立法

法律

「詳細は政令で定める」

内閣

政令

単なる慣習＝慣習法

慣行
↓
長期間・反復
↓
法的規範として認められる
↓
慣習法
というイメージ。
", "19": "第19章　慣習と法律
法律と慣習が存在する場合、

", "20": "第20章　判例とは何か

裁判所が具体的事件について示した判断

最高裁判所の判断

", "21": "第21章　判例は法律そのものなのか

先例として非常に重要な法的意味

したがって、
法律

条文
↓
裁判所による解釈
↓
判例
↓
その後の事件に影響

", "22": "第22章　最高裁判例の重要性
最高裁判所がある法律について、
一定の解釈

下級裁判所もその判断を強く意識して判断する。

実務上、最高裁判例は非常に重要な法解釈の基準
となる。
", "23": "第23章　判例と条文

", "24": "第24章　判例と法解釈

抽象的な文言
が多い。
例えば、
「正当な理由」
「相当な期間」
「信義に従い」
など。
そこで裁判所が、
具体的事件でどのような意味を持つか
を判断する。
", "25": "第25章　法解釈とは何か
法解釈とは、
法規範の意味・内容を明らかにする作業
である。
単に、

だけではない。
その文言が、
「この事件ではどういう意味になるのか」
まで考える。
", "26": "第26章　なぜ法解釈が必要なのか
法律の条文は、
すべての具体的事件を詳細に書いているわけではない。
例えば、
「権利を濫用してはならない」
という条文がある。
では、
どこからが権利濫用なのか？
という問題が生じる。
そこで解釈が必要になる。
", "27": "第27章　文理解釈
文理解釈とは、
条文の文言・文章構造を重視して意味を明らかにする解釈

まず、
「条文に何と書いてあるか」
を見る。
法律解釈の出発点となる。
", "28": "第28章　論理解釈
論理解釈とは、
条文の文言だけでなく、制度・目的・他の条文との関係などを考慮して意味を明らかにする解釈
である。
例えば、
条文
↓
制度趣旨
↓
他の条文
↓
法体系
↓
具体的意味
と考える。
", "29": "第29章　目的論的解釈
目的論的解釈では、
その法律が何のために作られたのか
を考える。
例えば、
消費者保護を目的とする法律なら、
消費者保護という目的
を踏まえて条文を解釈する。
ただし、
目的だけを理由に条文の文言から大きく離れてよいわけではない。
", "30": "第30章　体系解釈
体系解釈とは、
その条文だけでなく、法律全体・法体系との関係から意味を考える方法
である。
条文A
↕
条文B
↕
条文C
↓
法律全体
↓
意味を確定
という考え方。
", "31": "第31章　反対解釈
反対解釈とは、
ある事項について法律が規定していることから、その反対の場合にはその規定を適用しないと考える解釈
である。
ただし、
いつでも反対解釈が成立するわけではない。
条文の趣旨・構造を確認する必要がある。
", "32": "第32章　類推解釈
類推解釈とは、
条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること
である。
Aの場合
↓
法律が規定

Bの場合
↓
条文には直接書いていない
↓
AとBの趣旨が実質的に同じ
↓
類推適用を検討
", "33": "第33章　拡張解釈
拡張解釈とは、
条文の文言が通常理解される範囲よりも広く、その意味を解する解釈
である。
ただし、
法律の文言から完全に離れて自由に意味を作ることではない。
", "34": "第34章　縮小解釈
縮小解釈とは、
条文の文言上は広く読める場合でも、趣旨等から適用範囲を狭くする解釈
である。
例えば、
文言だけなら広く適用できそうだが、制度趣旨から一部の場合を除外する
といった場合。
", "35": "第35章　反対解釈と類推解釈
この2つは混同しやすい。
反対解釈
A
↓
法律が適用される

B
↓
Aと反対だから
↓
法律を適用しない
類推解釈
A
↓
法律が適用される

B
↓
Aと趣旨が同じ
↓
条文を類推適用

★ 第3編の最重要10ポイント
1. 法源とは、法的判断の根拠となる法規範の形式・由来である。
2. 日本では憲法・法律などの成文法が中心的な位置を占める。
3. 命令は法律に反することができず、委任にも限界がある。
4. 条例は地方公共団体による自治立法である。
5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。
6. 法解釈とは、法規範の意味・内容を明らかにする作業である。
7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。
8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。
9. 法の適用では、法規範・事実・当てはめを区別する。
10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。

★ 第1編の最重要ポイント10
1. 法は社会を規律する公的な規範である。
2. 法には社会秩序を維持する機能がある。
3. 法には権利・自由・人権を保障する機能もある。
4. 権利には、それに対応する義務が存在することが多い。
5. 法律関係では「誰が・誰に・何を請求できるか」を考える。
6. 法規範は「要件→効果」という構造で理解すると分かりやすい。
7. 法と道徳・慣習・社会規範は区別する。
8. 法の支配は国家権力そのものを法によって拘束する考え方である。
9. 法的主体には自然人や法人がある。
10. 法律問題は「事実→法規範→要件→当てはめ→効果→救済」で考える。

4. 条例は地方公共団体による自治立法である。

const app=document.getElementById("app"),back=document.getElementById("back");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 back.style.display=page==="home"?"none":"block";
 if(page==="home")home(); else if(page==="list")chapterList(); else quiz();
}
function home(){
 app.innerHTML=`<div class="hero"><h2>基礎法学 基礎本</h2><p>本文をそのまま使い、重要語句を穴埋めして覚える学習アプリ。</p><p class="muted">各空欄を1つずつ回答し、最後に正誤・正答・元本文を確認できます。</p></div>
 <div class="grid">${DATA.parts.map((p,pi)=>`<button class="card part" onclick="openPart(${pi})"><span><span class="tag">${esc(p[0])}</span><br><b>${esc(p[1])}</b><br><span class="muted">全${p[2]}章</span></span><span>›</span></button>`).join("")}</div>`;
}
function openPart(pi){page="list";currentPart=pi;render();}
function chapterList(){
 const p=DATA.parts[currentPart], ts=DATA.titles[currentPart];
 app.innerHTML=`<div class="hero"><span class="tag">${esc(p[0])}</span><h2>${esc(p[1])}</h2><p class="muted">全${p[2]}章</p></div><div class="grid">${ts.map((t,i)=>`<button class="card chapter" onclick="openChapter(${currentPart},${i})"><span class="num">${i+1}</span><span class="title">${esc(t)}</span><span>›</span></button>`).join("")}</div>`;
}
function openChapter(pi,i){currentPart=pi;ci=i;blankIndex=0;answers=[];page="quiz";render();}
function quiz(){
 const key=ci+1, partNo=ci<68?1:2, localNo=ci<68?ci+1:ci-67, title=DATA.titles[ci], q=DATA.questions[key];
 if(!q || !q[0]){app.innerHTML=`<div class="card"><span class="tag">第${partNo}編・第${localNo}章</span><h2>${esc(title)}</h2><div class="warning">問題データがありません。</div></div>`;return;}
 const item=q[0], done=blankIndex>=item.answers.length, progress=Math.round((blankIndex/item.answers.length)*100);
 const markers=item.answers.map((a,i)=>`<span class="tag">${i<blankIndex?(answers[i]===a.correct?"○":"×"):i===blankIndex?"回答中":"未回答"}</span>`).join("");
 let opts=""; if(!done){const a=item.answers[blankIndex];opts=a.options.map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}．${esc(o)}</button>`).join("");}
 let result=""; if(done){const score=item.answers.reduce((n,a,i)=>n+(answers[i]===a.correct?1:0),0); result=`<div class="result"><div class="score">${score} / ${item.answers.length} 正解</div>${item.answers.map((a,i)=>`<div class="answerline">${i+1}．${answers[i]===a.correct?'<span class="ok">○ 正解</span>':'<span class="ng">× 不正解</span>'}<br>正答：<b>${esc(a.correct)}</b></div>`).join("")}</div><div class="source"><b>答え合わせ・元の本文</b><br>${esc(item.source)}</div><button class="next" onclick="nextChapter()">${ci+1<DATA.titles.length?'次の章へ →':'章一覧へ →'}</button>`;}
 app.innerHTML=`<div class="card"><span class="tag">第${partNo}編・第${localNo}章</span><h2>${esc(title)}</h2><div class="progress"><div class="bar" style="width:${progress}%"></div></div><p class="muted">空欄 ${Math.min(blankIndex+1,item.answers.length)} / ${item.answers.length}</p><div>${markers}</div><div class="qtext">${esc(item.text)}</div>${!done?`<div class="question-note"><b>「${blankIndex+1}」の答えを選択</b></div><div class="opts">${opts}</div>`:''}${result}</div>`;
}
function answer(i){const a=DATA.questions[String(currentPart+1)][String(ci+1)][0].answers[blankIndex];answers[blankIndex]=a.options[i];blankIndex++;render();}
function nextChapter(){ if(ci+1<DATA.titles[currentPart].length){openChapter(currentPart,ci+1)} else{page="list";render()} }
